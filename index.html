    // ---------------- XỬ LÝ TƯƠNG TÁC TRẢ LỜI TRONG BÀI THI ----------------
    function triggerAutoAdvance(hasExplanation) {
      cancelAutoNext();
      if (!S || S.mode !== 'practice' || !RAM.settings.oneHand) return;
      var waitMs = hasExplanation ? 1200 : 450;
      AppState.autoNextTimer = setTimeout(function () {
        AppState.autoNextTimer = 0;
        if (!S || AppState.screen !== 'quiz') return;
        if (S.curIdx < S.items.length - 1) {
          S.curIdx += 1;
          persistCurrentSession(false);
          renderQuizView();
        } else {
          finishAndSubmitQuiz();
        }
      }, waitMs);
    }

    function vibrateDevice(pattern) {
      try {
        if (navigator.vibrate) navigator.vibrate(pattern);
      } catch (_) {}
    }

    function handlePickSingle(dispIdx) {
      if (!S) return;
      var item = S.items[S.curIdx];
      var q = CATALOG_MAP[item.uid];
      if (!item || !q) return;

      // Chế độ Phòng thi: chỉ lưu lựa chọn, chưa chấm
      if (S.mode === 'exam') {
        item.picked = dispIdx;
        AudioSynth.tap();
        persistCurrentSession(false);
        renderQuizView();
        return;
      }

      // Chế độ Luyện tập mặc định (2 bước)
      if (!RAM.settings.oneHand) {
        if (item.checked) return;
        item.picked = dispIdx;
        AudioSynth.tap();
        persistCurrentSession(false);
        renderQuizView();
        return;
      }

      // Chế độ 1 Tay thông minh: Chạm chấm điểm ngay lập tức!
      if (item.checked) {
        // Nếu đã đúng rồi mà người dùng chạm nhẹ lần nữa thì qua câu luôn
        cancelAutoNext();
        if (S.curIdx < S.items.length - 1) {
          S.curIdx += 1;
          persistCurrentSession(false);
          renderQuizView();
        } else {
          finishAndSubmitQuiz();
        }
        return;
      }

      item.picked = dispIdx;
      var isRight = dispIdx === item.correctIdx;
      recordFirstAttemptIfNeeded(item, isRight);

      if (isRight) {
        item.checked = true;
        AudioSynth.correct();
        vibrateDevice(25);
        showToast('Làm tốt lắm - Hãy giữ vững phong độ. Tiến lên', 'ok', 1350);
        persistCurrentSession(false);
        renderQuizView();
        triggerAutoAdvance(Boolean(q.explanation));
      } else {
        // Nếu SAI ở chế độ 1 tay: đánh dấu viền đỏ mờ phương án đó & cho chạm chọn lại đáp án khác ngay lập tức!
        if (!item.triedWrong) item.triedWrong = [];
        if (item.triedWrong.indexOf(dispIdx) === -1) item.triedWrong.push(dispIdx);
        logWrongTry(item); // lúc này item.picked vẫn là đáp án sai vừa bấm
        item.picked = null;
        AudioSynth.wrong();
        vibrateDevice([40, 50, 40]);
        showToast('Không đúng! Chọn lại để tiếp tục (câu này không được cộng điểm)', 'bad', 2000);
        persistCurrentSession(false);
        renderQuizView();
      }
    }

    function handlePickTrueFalse(sIdx, boolVal) {
      if (!S) return;
      var item = S.items[S.curIdx];
      var q = CATALOG_MAP[item.uid];
      if (!item || !q) return;

      if (item.picks[sIdx] === boolVal) return;

      if (S.mode === 'exam') {
        item.picks[sIdx] = boolVal;
        AudioSynth.tap();
        persistCurrentSession(false);
        renderQuizView();
        return;
      }

      // Trong chế độ 1 tay: nếu đã chấm nhưng có ý sai, cho chạm sửa lại trực tiếp trên nút [Đúng]/[Sai]!
      if (item.checked && RAM.settings.oneHand) {
        var prevEv = evaluateQuizItem(item);
        if (!prevEv.isFullCorrect) {
          item.picks[sIdx] = boolVal;
          var nextEv = evaluateQuizItem(item);
          if (nextEv.isFullCorrect) {
            AudioSynth.correct();
            vibrateDevice(25);
            showToast('Đã sửa đúng cả 4 ý — điểm chỉ tính theo lần chọn đầu', 'ok', 1800);
            persistCurrentSession(false);
            renderQuizView();
            triggerAutoAdvance(Boolean(q.explanation));
          } else {
            logWrongTry(item);
            AudioSynth.tap();
            persistCurrentSession(false);
            renderQuizView();
          }
          return;
        }
      }

      if (item.checked) return;

      item.picks[sIdx] = boolVal;
      AudioSynth.tap();

      var allFourPicked = item.picks.every(function (p) { return p === true || p === false; });
      if (RAM.settings.oneHand && allFourPicked) {
        item.checked = true;
        var ev = evaluateQuizItem(item);
        recordFirstAttemptIfNeeded(item, ev.isFullCorrect);
        if (ev.isFullCorrect) {
          AudioSynth.correct();
          vibrateDevice(25);
          showToast('Làm tốt lắm - Hãy giữ vững phong độ. Tiến lên', 'ok', 1400);
          persistCurrentSession(false);
          renderQuizView();
          triggerAutoAdvance(Boolean(q.explanation));
        } else {
          logWrongTry(item);
          AudioSynth.wrong();
          vibrateDevice([40, 50, 40]);
          showToast('Có ý chưa đúng — kéo/chạm thanh trượt để sửa (lần sửa không cộng điểm)', 'bad', 2400);
          persistCurrentSession(false);
          renderQuizView();
        }
        return;
      }

      persistCurrentSession(false);
      renderQuizView();
    }

    function handleCheckCurrentAnswer() {
      if (!S || S.mode !== 'practice') return;
      var item = S.items[S.curIdx];
      var q = CATALOG_MAP[item.uid];
      if (!item || !q || item.checked) return;
      if (!isItemAnswered(item)) {
        showToast('⚠️ Hãy chọn/nhập đủ đáp án trước khi Kiểm tra!', 'bad');
        return;
      }

      item.checked = true;
      var ev = evaluateQuizItem(item);
      recordFirstAttemptIfNeeded(item, ev.isFullCorrect);

      if (ev.isFullCorrect) {
        AudioSynth.correct();
        vibrateDevice(25);
        if (RAM.settings.oneHand) {
          showToast('Làm tốt lắm - Hãy giữ vững phong độ. Tiến lên', 'ok', 1350);
          triggerAutoAdvance(Boolean(q.explanation));
        }
      } else {
        logWrongTry(item);
        AudioSynth.wrong();
        vibrateDevice([40, 50, 40]);
      }

      persistCurrentSession(false);
      renderQuizView();
    }

          if (t === '+') { sheets.push(mkD()); si = sheets.length - 1; }
          else if (t === 'x') { if (!confirm('Xóa tờ nháp này?')) return; sheets.splice(si, 1); si = Math.min(si, sheets.length - 1); }
          else si = +t;
          gotoSheet();
        });
        var ci = document.getElementById('sc-calc');
        ['keydown', 'keyup', 'keypress'].forEach(function (n) { ci.addEventListener(n, function (e) { e.stopPropagation(); }); });
        ci.addEventListener('input', showCalc);
        document.getElementById('sc-deg').addEventListener('click', function () { st.deg = !st.deg; sync(); showCalc(); });
        sync();
      }
      function open() { layer.classList.remove('hidden'); document.documentElement.classList.add('sc-open'); setMode(st.mode); }
      function close() { closePop(); document.documentElement.classList.remove('sc-open'); layer.classList.add('hidden'); ring.style.display = 'none'; }

      return { init: init, toggle: function () { if (!layer) return; if (hidden()) open(); else close(); } };
    })();

    // ---------------- GẮN SỰ KIỆN ỦY QUYỀN DUY NHẤT (CLEAN EVENT DELEGATION) ----------------
    function bindGlobalEvents() {
      // 1. Callback khi thanh trượt Liquid Glass chọn mục mới
      var lbPend = 0, rvPend = 0;
      onLgSelectCallback = function (key, val) {
        if (key === 'nav') {
          AppState.screen = 'tabs';
          AppState.tab = val;
          renderActiveTabBody();
        } else if (key === 'mode') {
          RAM.settings.mode = val;
          StorageEngine.saveSettings();
          var box = document.getElementById('exam-mins-box');
          if (box) box.style.display = val === 'exam' ? '' : 'none';
        } else if (key === 'lbFilter') {
          AppState.lbFilter = val;
          var pills = document.getElementById('lb-lesson-pills');
          if (pills) pills.style.display = val === 'lesson' ? '' : 'none';
          if (!lbPend) { lbPend = 1; requestAnimationFrame(function () { setTimeout(function () { lbPend = 0; renderLeaderboardListOnly(); }, 0); }); }
        } else if (key === 'revFilter') {
          AppState.revFilter = val;
          if (!rvPend) { rvPend = 1; requestAnimationFrame(function () { setTimeout(function () { rvPend = 0; renderReviewItemsOnly(); }, 0); }); }
        } else if (key === 'theme') {
          var tEl = document.querySelector('.lg[data-lg="theme"]'), tr = tEl ? tEl.getBoundingClientRect() : null;
          setThemeMode(val, tr ? tr.left + tr.width / 2 : null, tr ? tr.top + tr.height / 2 : null);
        }
      };

      // 2. Ủy quyền Click duy nhất trên toàn tài liệu
      document.addEventListener('click', function (ev) {
        var actEl = ev.target && ev.target.closest ? ev.target.closest('[data-act]') : null;
        if (!actEl) return;
        var act = actEl.getAttribute('data-act');

        // Ngăn sự kiện click nút loại trừ lan ra chọn đáp án
        if (act === 'elim-opt') {
          ev.stopPropagation();
          if (!S) return;
          var eItem = S.items[S.curIdx];
          var oIdx = parseInt(actEl.getAttribute('data-idx'), 10);
          if (!eItem.eliminated) eItem.eliminated = [];
          var pos = eItem.eliminated.indexOf(oIdx);
          if (pos === -1) eItem.eliminated.push(oIdx);
          else eItem.eliminated.splice(pos, 1);
          AudioSynth.tap();
          persistCurrentSession(false);
          renderQuizView();
          return;
        }

        switch (act) {
          case 'close-modal':
            closeModal();
            break;
          case 'close-modal-bg':
            if (ev.target === actEl) closeModal();
            break;
          case 'resume-quiz':
            resumeSavedSession();
            break;
          case 'discard-resume':
            StorageEngine.saveActiveSession(null);
            S = null;
            renderActiveTabBody();
            showToast('🗑️ Đã xóa phiên làm dở', '', 1500);
            break;

          case 'toggle-setting': {
            var sKey = actEl.getAttribute('data-key');
            RAM.settings[sKey] = !RAM.settings[sKey];
            StorageEngine.saveSettings();
            AudioSynth.tap();
            actEl.classList.toggle('on', Boolean(RAM.settings[sKey]));
            if (sKey === 'lite') {
              applyLite();
              showToast(RAM.settings.lite ? '🪶 Đã bật chế độ siêu tối giản' : '✨ Đã trả lại đầy đủ hiệu ứng', '', 1500);
            }
            break;
          }

          case 'set-exam-min': {
            RAM.settings.examMinutes = parseInt(actEl.getAttribute('data-min'), 10) || 45;
            StorageEngine.saveSettings();
            AudioSynth.tap();
            document.querySelectorAll('[data-act="set-exam-min"]').forEach(function (b) {
              b.classList.toggle('on', parseInt(b.getAttribute('data-min'), 10) === RAM.settings.examMinutes);
            });
            break;
          }

          case 'toggle-lesson': {
            var lsTitle = actEl.getAttribute('data-lesson');
            var curLs = RAM.settings.selectedLessons || [];
            var lPos = curLs.indexOf(lsTitle);
            if (lPos === -1) curLs.push(lsTitle);
            else if (curLs.length > 1) curLs.splice(lPos, 1);
            else showToast('ℹ️ Cần chọn ít nhất 1 bài học', '');
            RAM.settings.selectedLessons = curLs;
            StorageEngine.saveSettings();
            AudioSynth.tap();
            renderActiveTabBody();
            break;
          }

          case 'select-all-lessons':
            RAM.settings.selectedLessons = LESSONS.map(function (l) { return l.title; });
            StorageEngine.saveSettings();
            AudioSynth.tap();
            renderActiveTabBody();
            break;

          case 'toggle-qtype': {
            var qt = actEl.getAttribute('data-qtype');
            var curTypes = RAM.settings.selectedTypes || [];
            var tPos = curTypes.indexOf(qt);
            if (tPos === -1) curTypes.push(qt);
            else if (curTypes.length > 1) curTypes.splice(tPos, 1);
            else showToast('ℹ️ Cần giữ ít nhất 1 dạng câu hỏi', '');
            RAM.settings.selectedTypes = curTypes;
            StorageEngine.saveSettings();
            AudioSynth.tap();
            renderActiveTabBody();
            break;
          }

          case 'start-main': {
            var mainPool = countSelectedPool();
            startNewQuizSession(mainPool);
            break;
          }

          case 'quick-star': {
            var starPool = getBookmarkPool('star');
            if (starPool.length === 0) {
              showToast('⭐ Chưa có câu nào được gắn cờ "Câu hay"', '');
              return;
            }
            startNewQuizSession(starPool, '⭐ Ôn tập Câu hay (' + starPool.length + ' câu)', 'practice');
            break;
          }

          case 'quick-warn': {
            var warnPool = getBookmarkPool('warn');
            if (warnPool.length === 0) {
              showToast('⚠️ Chưa có câu nào được gắn cờ "Câu phân vân"', '');
              return;
            }
            startNewQuizSession(warnPool, '⚠️ Ôn tập Câu phân vân (' + warnPool.length + ' câu)', 'practice');
            break;
          }

          case 'quick-wrong': {
            var wrongRows = getWrongStatsSorted();
            if (wrongRows.length === 0) {
              showToast('🎉 Hiện chưa có câu nào trong danh sách hay làm sai!', 'ok');
              return;
            }
            var wPool = wrongRows.map(function (r) { return r.q; });
            startNewQuizSession(wPool, '❗ Luyện câu hay sai (' + wPool.length + ' câu)', 'practice');
            break;
          }

          case 'export-json':
            StorageEngine.exportBackupJson();
            showToast('💾 Đã xuất file sao lưu (.json) thành công!', 'ok');
            break;

          case 'import-json': {
            var fInp = document.getElementById('backup-file-input');
            if (fInp) { fInp.value = ''; fInp.click(); }
            break;
          }

          case 'pick-single':
            handlePickSingle(parseInt(actEl.getAttribute('data-idx'), 10));
            break;

          case 'pick-tf':
            handlePickTrueFalse(
              parseInt(actEl.getAttribute('data-sidx'), 10),
              actEl.getAttribute('data-val') === 'true'
            );
            break;

          case 'numpad': {
            if (!S) return;
            var npItem = S.items[S.curIdx];
            if (!npItem || npItem.type !== 'short' || npItem.checked) return;
            var k = actEl.getAttribute('data-k');
            AudioSynth.tap();
            if (k === 'OK') {
              handleCheckCurrentAnswer();
              return;
            }
            var curTxt = String(npItem.inputText || '');
            if (k === 'C') curTxt = '';
            else if (k === '⌫') curTxt = curTxt.slice(0, -1);
            else if (k === '-') curTxt = curTxt.indexOf('-') === 0 ? curTxt.slice(1) : ('-' + curTxt);
            else if (k === ',') {
              if (curTxt.indexOf(',') === -1 && curTxt.indexOf('.') === -1) {
                curTxt = (curTxt === '' || curTxt === '-') ? (curTxt + '0,') : (curTxt + ',');
              }
            } else if (curTxt.length < 14) {
              curTxt += k;
            }
            npItem.inputText = curTxt;
            persistCurrentSession(false);
            renderQuizView();
            break;
          }

          case 'check-answer':
            handleCheckCurrentAnswer();
            break;

          case 'retry-current': {
            if (!S) return;
            cancelAutoNext();
            var rItem = S.items[S.curIdx];
            rItem.checked = false;
            if (rItem.type === 'single') rItem.picked = null;
            if (rItem.type === 'truefalse') rItem.picks = [null, null, null, null];
            if (rItem.type === 'short') rItem.inputText = '';
            AudioSynth.tap();
            persistCurrentSession(false);
            renderQuizView();
            break;
          }

          case 'next-or-finish':
            cancelAutoNext();
            if (!S) return;
            if (S.curIdx < S.items.length - 1) {
              S.curIdx += 1;
              AudioSynth.tap();
              persistCurrentSession(false);
              renderQuizView();
            } else {
              finishAndSubmitQuiz();
            }
            break;

          case 'prev-q':
            cancelAutoNext();
            if (S && S.curIdx > 0) {
              S.curIdx -= 1;
              AudioSynth.tap();
              persistCurrentSession(false);
              renderQuizView();
            }
            break;

          case 'next-q':
            cancelAutoNext();
            if (S && S.curIdx < S.items.length - 1) {
              S.curIdx += 1;
              AudioSynth.tap();
              persistCurrentSession(false);
              renderQuizView();
            }
            break;

          case 'pause-to-home':
            cancelAutoNext();
            stopQuizTimerLoop();
            persistCurrentSession(true);
            AppState.screen = 'tabs';
            AppState.tab = 'home';
            renderShell();
            showToast('💾 Đã lưu tiến trình — Bạn có thể làm tiếp bất cứ lúc nào!', 'ok');
            break;

          case 'quick-toggle-onehand':
            cancelAutoNext();
            RAM.settings.oneHand = !RAM.settings.oneHand;
            StorageEngine.saveSettings();
            AudioSynth.tap();
            renderQuizView();
            showToast('🤚 Chế độ 1 Tay: ' + (RAM.settings.oneHand ? 'ĐÃ BẬT' : 'ĐÃ TẮT'), '');
            break;

          case 'quick-toggle-lite':
            RAM.settings.lite = !RAM.settings.lite;
            StorageEngine.saveSettings();
            applyLite();
            showToast(RAM.settings.lite ? '🪶 Đã bật chế độ siêu tối giản' : '✨ Đã trả lại đầy đủ hiệu ứng', '', 1500);
            renderQuizView();
            break;

          case 'quick-toggle-sound':
            RAM.settings.sound = !RAM.settings.sound;
            StorageEngine.saveSettings();
            if (RAM.settings.sound) AudioSynth.tap();
            renderQuizView();
            break;

          case 'font-dec':
            stepFontScale(-1);
            break;

          case 'font-inc':
            stepFontScale(1);
            break;

          case 'quick-toggle-focus':
            RAM.settings.focus = !RAM.settings.focus;
            StorageEngine.saveSettings();
            AudioSynth.tap();
            renderQuizView();
            showToast('🎯 Chế độ Tập trung: ' + (RAM.settings.focus ? 'ĐÃ BẬT' : 'ĐÃ TẮT'), '', 1100);
            break;

          case 'quick-toggle-theme':
            AudioSynth.tap();
            setThemeMode(resolveTheme() === 'light' ? 'dark' : 'light', ev.clientX, ev.clientY, function () {
              actEl.textContent = resolveTheme() === 'light' ? '🌙' : '☀️';
            });
            break;

          case 'toggle-scratch':
            Scratchpad.toggle();
            break;

          case 'bookmark': {
            if (!S) return;
            var curQ = S.items[S.curIdx];
            var bmKind = actEl.getAttribute('data-bm');
            if (RAM.bookmarks[curQ.uid] === bmKind) delete RAM.bookmarks[curQ.uid];
            else RAM.bookmarks[curQ.uid] = bmKind;
            StorageEngine.saveBookmarks();
            AudioSynth.tap();
            renderQuizView();
            break;
          }

          case 'open-palette':
            openQuestionPaletteModal();
            break;

          case 'jump-q':
            if (S) {
              S.curIdx = parseInt(actEl.getAttribute('data-qidx'), 10) || 0;
              closeModal();
              persistCurrentSession(false);
              renderQuizView();
            }
            break;

          case 'submit-exam': {
            if (!S) return;
            closeModal();
            var unAns = S.items.filter(function (i) { return !isItemAnswered(i); }).length;
            if (unAns > 0) {
              if (!window.confirm('Bạn còn ' + unAns + ' câu chưa trả lời. Bạn có chắc chắn muốn nộp bài ngay?')) {
                return;
              }
            }
            finishAndSubmitQuiz();
            break;
          }

          case 'zoom-img':
            openImageZoomModal(actEl.getAttribute('src'));
            break;

          case 'retry-wrong-last': {
            var last = AppState.lastResult;
            if (!last || !Array.isArray(last.wrongUids) || last.wrongUids.length === 0) return;
            var retryPool = last.wrongUids.map(function (id) { return CATALOG_MAP[id]; }).filter(Boolean);
            startNewQuizSession(retryPool, '🔁 Làm lại ' + retryPool.length + ' câu sai', 'practice', true);
            break;
          }

          case 'retry-wrong-record': {
            var recId = actEl.getAttribute('data-id');
            var foundRec = RAM.historyRecords.find(function (r) { return r.id === recId; });
            if (!foundRec || !Array.isArray(foundRec.wrongUids)) return;
            var recPool = foundRec.wrongUids.map(function (id) { return CATALOG_MAP[id]; }).filter(Boolean);
            startNewQuizSession(recPool, '🔁 Làm lại ' + recPool.length + ' câu sai', 'practice', true);
            break;
          }

          case 'open-review': {
            var revId = actEl.getAttribute('data-id');
            var targetRec = (AppState.lastResult && AppState.lastResult.id === revId)
              ? AppState.lastResult
              : RAM.historyRecords.find(function (r) { return r.id === revId; });
            if (targetRec) {
              AppState.reviewRecord = targetRec;
              AppState.revFilter = 'all';
              AppState.screen = 'review';
              renderShell();
            }
            break;
          }

          case 'goto-leaderboard':
            AppState.screen = 'tabs';
            AppState.tab = 'leaderboard';
            renderShell();
            break;

          case 'back-to-tabs':
            AppState.screen = 'tabs';
            renderShell();
            break;

          case 'clear-history':
            if (window.confirm('Xóa toàn bộ lịch sử các lượt làm bài trên thiết bị này?')) {
              StorageEngine.clearHistory();
              renderActiveTabBody();
              showToast('🗑️ Đã xóa lịch sử làm bài', '');
            }
            break;

          case 'check-answer-key':
            AudioSynth.tap();
            AnswerKey.checkNow(true);
            break;

          case 'refresh-lb':
            AudioSynth.tap();
            LeaderboardEngine.fetchEntries(true).then(function () {
              showToast('🔄 Đã đồng bộ Bảng xếp hạng mới nhất', 'ok', 1300);
            });
            break;

          case 'set-lb-lesson':
            AppState.lbLesson = actEl.getAttribute('data-lesson') || 'ALL';
            AudioSynth.tap();
            document.querySelectorAll('[data-act="set-lb-lesson"]').forEach(function (b) {
              b.classList.toggle('on', (b.getAttribute('data-lesson') || 'ALL') === AppState.lbLesson);
            });
            renderLeaderboardListOnly();
            break;
        }
      });

      // 3. Click chuột phải trên phương án .opt để gạch loại trừ đáp án nhiễu
      document.addEventListener('contextmenu', function (ev) {
        var optEl = ev.target && ev.target.closest ? ev.target.closest('.opt[data-act="pick-single"]') : null;
        if (!optEl || !S || AppState.screen !== 'quiz') return;
        ev.preventDefault();
        var item = S.items[S.curIdx];
        var dIdx = parseInt(optEl.getAttribute('data-idx'), 10);
        if (!item.eliminated) item.eliminated = [];
        var pos = item.eliminated.indexOf(dIdx);
        if (pos === -1) item.eliminated.push(dIdx);
        else item.eliminated.splice(pos, 1);
        AudioSynth.tap();
        persistCurrentSession(false);
        renderQuizView();
      });

      // 4. Ủy quyền sự kiện nhập liệu (Họ tên, Ô trả lời ngắn, Ghi chú cá nhân, File JSON)
      document.addEventListener('input', function (ev) {
        var t = ev.target;
        if (!t) return;

        if (t.id === 'inp-player-name') {
          RAM.settings.playerName = t.value;
          StorageEngine.saveSettings();
          return;
        }

        if (t.id === 'short-ans-input' && S) {
          var sItem = S.items[S.curIdx];
          if (sItem && sItem.type === 'short') {
            sItem.inputText = t.value;
            persistCurrentSession(false);
            var chkBtn = document.querySelector('[data-act="check-answer"]');
            if (chkBtn) chkBtn.disabled = !isItemAnswered(sItem);
          }
          return;
        }

        if (t.id === 'personal-note-inp') {
          cancelAutoNext(); // Không tự chuyển câu khi người dùng đang gõ ghi chú
          var uid = t.getAttribute('data-uid');
          if (uid) {
            RAM.notes[uid] = t.value;
            StorageEngine.saveNotes();
          }
        }
      });

      document.addEventListener('focusin', function (ev) {
        if (ev.target && ev.target.id === 'personal-note-inp') {
          cancelAutoNext();
        }
      });

      var fileInp = document.getElementById('backup-file-input');
      if (fileInp) {
        fileInp.addEventListener('change', function (ev) {
          var file = ev.target.files && ev.target.files[0];
          if (!file) return;
          var reader = new FileReader();
          reader.onload = function () {
            try {
              StorageEngine.importBackupJson(String(reader.result || ''));
              renderShell();
              showToast('📥 Đã khôi phục dữ liệu sao lưu thành công!', 'ok', 2400);
            } catch (err) {
              showToast('❌ File sao lưu không đúng định dạng JSON!', 'bad', 2500);
            }
          };
          reader.readAsText(file);
        });
      }

      // 5. Phím tắt tốc độ cao trên máy tính (PC Speed-Run)
      document.addEventListener('keydown', function (ev) {
        if (AppState.screen !== 'quiz' || !S) return;
        var activeTag = document.activeElement ? document.activeElement.tagName : '';
        var isNote = document.activeElement && document.activeElement.id === 'personal-note-inp';
        if (isNote) return;

        var item = S.items[S.curIdx];
        if (!item) return;

        // Thanh trượt Đúng/Sai đang được focus: ← = Đúng, → = Sai
        var focSl = document.activeElement && document.activeElement.classList && document.activeElement.classList.contains('tf-sl') ? document.activeElement : null;
        if (focSl && !focSl.classList.contains('locked') && (ev.key === 'ArrowLeft' || ev.key === 'ArrowRight')) {
          ev.preventDefault();
          AppState.tfFocus = focSl.getAttribute('data-sidx');
          handlePickTrueFalse(parseInt(focSl.getAttribute('data-sidx'), 10), ev.key === 'ArrowLeft');
          return;
        }

        // Phím Enter trong ô Trả lời ngắn
        if (activeTag === 'INPUT' && document.activeElement.id === 'short-ans-input') {
          if (ev.key === 'Enter') {
            ev.preventDefault();
            if (S.mode === 'practice' && !item.checked) handleCheckCurrentAnswer();
            else if (S.curIdx < S.items.length - 1) {
              S.curIdx += 1;
              persistCurrentSession(false);
              renderQuizView();
            } else {
              finishAndSubmitQuiz();
            }
          }
          return;
        }

        if (activeTag === 'INPUT' || activeTag === 'TEXTAREA') return;

        var keyUpper = String(ev.key || '').toUpperCase();
        var mapChoice = { '1': 0, '2': 1, '3': 2, '4': 3, 'A': 0, 'B': 1, 'C': 2, 'D': 3 };

        if (item.type === 'single' && mapChoice[keyUpper] !== undefined) {
          ev.preventDefault();
          handlePickSingle(mapChoice[keyUpper]);
          return;
        }

        if (ev.key === 'Enter' || ev.key === ' ') {
          ev.preventDefault();
          cancelAutoNext();
          if (S.mode === 'practice' && !item.checked) {
            handleCheckCurrentAnswer();
          } else if (S.curIdx < S.items.length - 1) {
            S.curIdx += 1;
            persistCurrentSession(false);
            renderQuizView();
          } else {
            finishAndSubmitQuiz();
          }
          return;
        }

        if (ev.key === 'ArrowLeft' && S.curIdx > 0) {
          ev.preventDefault();
          cancelAutoNext();
          S.curIdx -= 1;
          persistCurrentSession(false);
          renderQuizView();
        } else if (ev.key === 'ArrowRight' && S.curIdx < S.items.length - 1) {
          ev.preventDefault();
          cancelAutoNext();
          S.curIdx += 1;
          persistCurrentSession(false);
          renderQuizView();
        }
      });

      // 6. Vuốt ngang chuyển câu (Swipe Gesture hỗ trợ thao tác 1 tay trên điện thoại)
      var touchX0 = 0;
      var touchY0 = 0;
      var touchIgnore = false;

      document.addEventListener('touchstart', function (ev) {
        if (AppState.screen !== 'quiz' || !S || !ev.touches || ev.touches.length !== 1) return;
        var scratchOpen = !!(ev.target && ev.target.closest && ev.target.closest('#scratch-layer'));
        if (scratchOpen || (ev.target && ev.target.closest && ev.target.closest('.lg, .tf-sl'))) {
          touchIgnore = true;
          return;
        }
        touchIgnore = false;
        touchX0 = ev.touches[0].clientX;
        touchY0 = ev.touches[0].clientY;
      }, { passive: true });

      document.addEventListener('touchend', function (ev) {
        if (touchIgnore || AppState.screen !== 'quiz' || !S || !ev.changedTouches || !ev.changedTouches[0]) return;
        var dx = ev.changedTouches[0].clientX - touchX0;
        var dy = ev.changedTouches[0].clientY - touchY0;
        if (Math.abs(dx) > 68 && Math.abs(dx) > Math.abs(dy) * 1.75) {
          cancelAutoNext();
          if (dx < 0 && S.curIdx < S.items.length - 1) {
            S.curIdx += 1;
            AudioSynth.tap();
            persistCurrentSession(false);
            renderQuizView();
          } else if (dx > 0 && S.curIdx > 0) {
            S.curIdx -= 1;
            AudioSynth.tap();
            persistCurrentSession(false);
            renderQuizView();
          }
        }
      }, { passive: true });
    }

    // ---------------- KÉO / CHẠM THANH TRƯỢT ĐÚNG-SAI (Pointer Events) ----------------
    function bindTfSliders() {
      var drag = null;
      function reset(sl) {
        if (!sl || !sl.isConnected) return;
        sl.classList.remove('drag');
        sl.style.removeProperty('--p');
        sl.style.removeProperty('--o');
        sl.style.removeProperty('--st');
      }
      function valOf(sl) {
        var v = sl.getAttribute('data-v');
        return v === 't' ? true : (v === 'f' ? false : null);
      }

      document.addEventListener('pointerdown', function (e) {
        if (!S || AppState.screen !== 'quiz') return;
        var sl = e.target && e.target.closest ? e.target.closest('.tf-sl') : null;
        if (!sl || sl.classList.contains('locked')) return;
        if (e.pointerType === 'mouse' && e.button !== 0) return;
        var r = sl.getBoundingClientRect();
        var bw = parseFloat(window.getComputedStyle(sl).borderLeftWidth) || 0;
        var innerW = Math.max(40, r.width - bw * 2 - 10);
        var cur = valOf(sl);
        drag = {
          sl: sl, id: e.pointerId, x0: e.clientX,
          innerLeft: r.left + bw + 5, thumbW: innerW / 2,
          neutral: cur === null, startP: cur === true ? 0 : (cur === false ? 1 : 0.5),
          p: cur === true ? 0 : (cur === false ? 1 : 0.5), moved: false,
          lx: e.clientX, lt: performance.now(), sv: 0
        };
        try { sl.setPointerCapture(e.pointerId); } catch (_) {}
      });

      document.addEventListener('pointermove', function (e) {
        if (!drag || e.pointerId !== drag.id) return;
        var dx = e.clientX - drag.x0;
        if (!drag.moved) {
          if (Math.abs(dx) < 6) return;
          drag.moved = true;
          drag.sl.classList.add('drag');
        }
        var p = drag.neutral
          ? (e.clientX - drag.innerLeft - drag.thumbW / 2) / drag.thumbW
          : drag.startP + dx / drag.thumbW;
        drag.p = Math.max(0, Math.min(1, p));
        // Vận tốc lướt -> giọt kính vươn dài theo chiều kéo (squash & stretch)
        var nowT = performance.now(), dtT = Math.max(1, nowT - drag.lt);
        drag.sv = drag.sv * 0.6 + ((e.clientX - drag.lx) / dtT) * 0.4;
        drag.lx = e.clientX; drag.lt = nowT;
        // [PERF] cảm ứng 120-240Hz bắn pointermove dày hơn số khung hình thật -> chỉ ghi style 1 lần / khung hình
        if (!drag.raf) { var dd = drag; dd.raf = requestAnimationFrame(function () { dd.raf = 0; paintDrag(dd); }); }
      });
      function paintDrag(d) {
        if (!d.sl || !d.sl.isConnected) return;
        var pv = d.p.toFixed(3), sv = Math.min(1, Math.abs(d.sv) / 1.1).toFixed(2);
        if (d._p !== pv) { d._p = pv; d.sl.style.setProperty('--p', pv); }
        if (!d._o) { d._o = 1; d.sl.style.setProperty('--o', '1'); }
        if (d._s !== sv) { d._s = sv; d.sl.style.setProperty('--st', sv); }
      }

      function endDrag(e, cancelled) {
        if (!drag || e.pointerId !== drag.id) return;
        var d = drag; drag = null;
        if (d.raf) { cancelAnimationFrame(d.raf); d.raf = 0; if (d.moved) paintDrag(d); } // áp nốt khung hình đang chờ -> không lệch vị trí khi nhả tay
        try { d.sl.releasePointerCapture(d.id); } catch (_) {}
        var sl = d.sl;
        if (cancelled) { reset(sl); return; }

        var val;
        if (d.moved) {
          val = d.p < 0.5;                       // nửa trái = Đúng, nửa phải = Sai
        } else {
          var r = sl.getBoundingClientRect();
          val = (e.clientX - r.left) < r.width / 2; // chạm nửa trái = Đúng, nửa phải = Sai
        }
        if (val === valOf(sl)) { reset(sl); return; }

        var key = sl.getAttribute('data-key');
        if (d.moved) TF_PREV[key] = { p: d.p, o: 1 }; // viên kính trượt tiếp từ chỗ nhả tay
        vibrateDevice(8);
        handlePickTrueFalse(parseInt(sl.getAttribute('data-sidx'), 10), val);
        // Lựa chọn được nhận -> render đã cập nhật tại chỗ, giữ nguyên hiệu ứng trượt; chỉ trả về vị trí cũ khi bị từ chối (vd. câu đã khóa)
        if (sl.isConnected && valOf(sl) !== val) { delete TF_PREV[key]; reset(sl); }
      }
      document.addEventListener('pointerup', function (e) { endDrag(e, false); });
      document.addEventListener('pointercancel', function (e) { endDrag(e, true); });
    }

    // =========================================================================
    // PHẦN 9B: KHUNG ĐÁP ÁN CUỐI FILE — ĐỒNG BỘ ĐÁP ÁN LIVE QUA GITHUB, CHẤM LẠI & THÔNG BÁO
    // Nguồn đáp án = khối "Khung đáp án" ở cuối file (thẻ script có id = answer-key).
    //  - Khi tải trang: áp đáp án trong khung lên đề (ghi đè đáp án gốc trong examData).
    //  - Cứ ~60 giây / khi quay lại tab / khi có mạng lại: tải lại chính file này từ GitHub,
    //    nếu khung đáp án đã đổi thì áp dụng ngay, chấm lại bài đang làm + Lịch sử và hiện thông báo.
    // =========================================================================
    // Để trống = dùng chính link trang đang mở (GitHub Pages). Có thể dán link khác trỏ tới file HTML này.
    const AK_SYNC_SOURCE = '';
    const AK_POLL_MS = 60000;

    const AnswerKey = (function () {
      var LS_SIGS = lgqKey('lgq_answer_sigs_v1');
      var LS_REMOTE = lgqKey('lgq_answer_key_remote_v1');
      var LS_NOTICE = lgqKey('lgq_answer_notice_v1');
      var LETTERS = 'ABCD';
      var KEY_RE = /<script[^>]*id=["']answer-key["'][^>]*>([\s\S]*?)<\/script>/i;

      // Đáp án gốc trong examData (dùng khi một câu không có dòng trong khung đáp án)
      var BASE = {};
      CATALOG.forEach(function (q) {
        BASE[q.uid] = { correct: q.correct, st: q.statements.map(function (s) { return s.correct; }) };
      });

      var cur = { version: 0, updated: '', note: '', hash: '', source: 'embedded', errors: [] };
      var sigs = {};        // chữ ký đáp án đang áp dụng (uid -> 'B' | 'SĐĐS' | '15')
      var notice = null;    // thông báo chưa được người dùng bấm "Đã hiểu"
      var checking = false, lastTry = 0, lastOkAt = 0, pollTimer = 0;
      var dirtyStats = {}, boardDirty = false;

      function lsGet(k) { try { var r = localStorage.getItem(k); return r ? JSON.parse(r) : null; } catch (_) { return null; } }
      function lsSet(k, v) { try { if (v === null || v === undefined) localStorage.removeItem(k); else localStorage.setItem(k, JSON.stringify(v)); } catch (_) {} }
      function hashStr(s) { var h = 5381; for (var i = 0; i < s.length; i++) h = ((h << 5) + h + s.charCodeAt(i)) | 0; return (h >>> 0).toString(16); }
      function clock(ts) { try { return new Date(ts).toLocaleTimeString('vi-VN', { hour: '2-digit', minute: '2-digit' }); } catch (_) { return ''; } }

      // ---------- Đọc khung đáp án ----------
      function parseText(text) {
        var out = { version: 0, updated: '', note: '', entries: {}, errors: [], hash: '' };
        var canon = [];
        String(text || '').normalize('NFC').split(/\r?\n/).forEach(function (raw, ln) {
          var line = raw.replace(/\s+(#|\/\/).*$/, '').trim();
          if (!line || line.charAt(0) === '#' || line.slice(0, 2) === '//') return;
          var m = line.match(/^(version|phiên\s*bản|updated|cập\s*nhật|note|ghi\s*chú)\s*[:=]\s*(.*)$/i);
          if (m) {
            var k = m[1].toLowerCase().replace(/\s+/g, '');
            if (k === 'version' || k === 'phiênbản') out.version = parseFloat(m[2]) || 0;
            else if (k === 'updated' || k === 'cậpnhật') out.updated = m[2].trim();
            else out.note = m[2].trim();
            return;
          }
          var e = line.match(/^(?:c[âa]u\s*)?([^\s:=|]+)(?:\s*[:=|]\s*|\s+)(.+)$/i);
          if (!e) { out.errors.push('Dòng ' + (ln + 1) + ': không đọc được "' + line + '"'); return; }
          var val = e[2].trim();
          out.entries[e[1]] = val;
          canon.push(e[1] + '=' + val.replace(/\s+/g, ' '));
        });
        out.hash = hashStr(canon.sort().join('\n'));
        return out;
      }

      // Trả về '' nếu hợp lệ, hoặc câu mô tả lỗi (không sửa gì khi lỗi)
      function applyEntry(q, val) {
        if (q.type === 'single') {
          var s = val.trim().toUpperCase().replace(/[\.\)]$/, '');
          var idx = -1;
          if (s.length === 1 && LETTERS.indexOf(s) >= 0) idx = LETTERS.indexOf(s);
          else if (/^[1-4]$/.test(s)) idx = parseInt(s, 10) - 1;
          if (idx < 0) return 'đáp án phải là A, B, C hoặc D';
          if (idx >= q.options.length) return 'đề chỉ có ' + q.options.length + ' phương án';
          q.correct = idx;
          return '';
        }
        if (q.type === 'truefalse') {
          var toks = val.normalize('NFC').match(/đúng|dung|true|sai|false|đ|d|t|s|f|1|0/gi) || [];
          if (toks.length !== q.statements.length) return 'cần đúng ' + q.statements.length + ' ý (Đ/S), đang đọc được ' + toks.length;
          var bools = toks.map(function (t) { var c = t.charAt(0).toLowerCase(); return c === 'đ' || c === 'd' || c === 't' || c === '1'; });
          q.statements.forEach(function (st, i) { st.correct = bools[i]; });
          return '';
        }
        if (!val.trim()) return 'đáp án trống';
        q.correct = val.trim();
        return '';
      }

      function sigOf(q) {
        if (q.type === 'single') return LETTERS.charAt(q.correct) || String(q.correct);
        if (q.type === 'truefalse') return q.statements.map(function (s) { return s.correct ? 'Đ' : 'S'; }).join('');
        return String(q.correct);
      }
      function computeSigs() { var o = {}; CATALOG.forEach(function (q) { o[q.uid] = sigOf(q); }); return o; }

      // Áp khung đáp án lên CATALOG, trả về danh sách câu đổi đáp án so với lần áp dụng trước trên thiết bị này
      function applyParsed(parsed, source) {
        CATALOG.forEach(function (q) {
          var b = BASE[q.uid];
          q.correct = b.correct;
          q.statements.forEach(function (st, i) { st.correct = b.st[i]; });
        });
        var errs = parsed.errors.slice();
        Object.keys(parsed.entries).forEach(function (uid) {
          var q = CATALOG_MAP[uid];
          if (!q) { errs.push('Câu #' + uid + ': không có trong đề (examData)'); return; }
          var er = applyEntry(q, parsed.entries[uid]);
          if (er) errs.push('Câu #' + uid + ': ' + er + ' → giữ đáp án gốc');
        });
        cur = { version: parsed.version, updated: parsed.updated, note: parsed.note, hash: parsed.hash, source: source, errors: errs };
        var next = computeSigs();
        var changes = [];
        Object.keys(next).forEach(function (uid) {
          if (sigs[uid] !== undefined && sigs[uid] !== next[uid]) changes.push({ uid: uid, from: sigs[uid], to: next[uid] });
        });
        sigs = next;
        lsSet(LS_SIGS, { sigs: sigs, version: cur.version, savedAt: Date.now() });
        if (errs.length) { try { console.warn('[Khung đáp án] ' + errs.length + ' dòng có vấn đề:\n' + errs.join('\n')); } catch (_) {} }
        return changes;
      }

      // ---------- Chấm lại ----------
      function firstSnap(tries, finalVal) {
        return (Array.isArray(tries) && tries.length) ? tries[0] : finalVal;
      }
      function grade(q, type, snap, ctx) {
        if (type === 'single') {
          if (snap === null || snap === undefined) return { full: false, pts: 0 };
          var oi = (ctx && Array.isArray(ctx.optOrder) && ctx.optOrder[snap] !== undefined) ? ctx.optOrder[snap] : snap;
          var ok = oi === q.correct;
          return { full: ok, pts: ok ? 1 : 0 };
        }
        if (type === 'truefalse') {
          var picks = Array.isArray(snap) ? snap : [null, null, null, null];
          var ord = (ctx && Array.isArray(ctx.stOrder) && ctx.stOrder.length === 4) ? ctx.stOrder : [0, 1, 2, 3];
          var right = 0, all = true;
          for (var i = 0; i < 4; i++) {
            var p = picks[i];
            if (p !== true && p !== false) { all = false; continue; }
            var st = q.statements[ord[i]];
            if (st && p === Boolean(st.correct)) right += 1;
          }
          return { full: all && right === 4, pts: calcTrueFalsePoints(right) };
        }
        var ok2 = isShortEqual(snap, q.correct);
        return { full: ok2, pts: ok2 ? 1 : 0 };
      }
      function adjustStat(uid, delta) {
        var st = RAM.stats[String(uid)];
        if (!st) return;
        st.wrongs = Math.max(0, Math.min(st.attempts || 0, (st.wrongs || 0) + delta));
        if (delta > 0 && !st.lastWrongAt) st.lastWrongAt = Date.now();
        dirtyStats[uid] = st;
      }

      // Chấm lại 1 lượt làm đã lưu trong Lịch sử (chỉ các câu có đáp án đổi)
      function regradeRecord(rec, changed) {
        if (!rec || !Array.isArray(rec.answers)) return null;
        var hit = false, practice = rec.mode === 'practice';
        var before = Number(rec.score10) || 0;
        rec.answers.forEach(function (a) {
          if (!changed[a.qId]) return;
          var q = CATALOG_MAP[a.qId];
          if (!q) return;
          hit = true;
          var ctx = { optOrder: a.optOrder, stOrder: a.stOrder };
          var fin = grade(q, a.type, a.picked, ctx);
          // Luyện tập: điểm chỉ tính theo LẦN CHỌN ĐẦU TIÊN (lần đầu = lần sai đầu tiên đã ghi, hoặc đáp án chốt nếu chưa từng sai)
          var fst = practice ? grade(q, a.type, firstSnap(a.tries, a.picked), ctx) : fin;
          var oldFirstWrong = Boolean(a.firstWrong);
          a.isCorrect = fin.full;
          a.finalPts = Number(fin.pts.toFixed(2));
          a.pts = Number(fst.pts.toFixed(2));
          a.firstWrong = !fst.full;
          if (oldFirstWrong !== a.firstWrong) adjustStat(a.qId, a.firstWrong ? 1 : -1);
        });
        if (!hit) return null;
        var earned = 0, full = 0, wrong = [];
        rec.answers.forEach(function (a) {
          earned += Number(a.pts) || 0;
          var counted = practice ? (!a.firstWrong && a.isCorrect) : a.isCorrect;
          if (counted) full += 1; else wrong.push(a.qId);
        });
        rec.score = Number(earned.toFixed(2));
        rec.correctCount = full;
        rec.wrongUids = wrong;
        rec.score10 = rec.maxScore > 0 ? Number(((earned / rec.maxScore) * 10).toFixed(2)) : 0;
        rec.regradedAt = Date.now();
        return { id: rec.id, when: rec.timestamp, label: rec.lessonLabel || 'Bài luyện tập', from: before, to: rec.score10 };
      }

      // Đồng bộ lại đáp án đúng trong một phiên đang làm dở (đáp án đã bị xáo trộn thứ tự nên phải ánh xạ lại)
      function reconcileSession(sess, changed) {
        if (!sess || !Array.isArray(sess.items)) return false;
        var hit = false;
        sess.items.forEach(function (it) {
          var q = CATALOG_MAP[it.uid];
          if (!q) return;
          if (it.type === 'single' && Array.isArray(it.optOrder)) {
            var ci = it.optOrder.indexOf(q.correct);
            if (ci >= 0) it.correctIdx = ci;
          }
          if (!changed || !changed[it.uid]) return;
          hit = true;
          if (it.type === 'single' && Array.isArray(it.triedWrong)) {
            it.triedWrong = it.triedWrong.filter(function (d) { return d !== it.correctIdx; });
          }
          if (sess.first && sess.first[it.uid] !== undefined) {
            var finalVal = it.type === 'single' ? it.picked : (it.type === 'truefalse' ? it.picks : it.inputText);
            var g = grade(q, it.type, firstSnap(it.tries, finalVal), { optOrder: it.optOrder, stOrder: it.stOrder });
            if (Boolean(sess.first[it.uid]) !== g.full) adjustStat(it.uid, g.full ? -1 : 1);
            sess.first[it.uid] = g.full;
            if (!sess.firstPts) sess.firstPts = {};
            sess.firstPts[it.uid] = g.pts;
          }
        });
        return hit;
      }

      function applyToSessions(changed) {
        var hit = false;
        if (S && !S.finished && AppState.screen === 'quiz') {
          hit = reconcileSession(S, changed);
          try { persistCurrentSession(false); } catch (_) {}
        } else if (RAM.activeSession) {
          hit = reconcileSession(RAM.activeSession, changed);
          if (hit) StorageEngine.saveActiveSession(RAM.activeSession);
        }
        return hit;
      }

      function syncBoard(rec) {
        (RAM.localBoard || []).forEach(function (e) {
          if (e && e.timestamp === rec.timestamp && e.playerName === rec.playerName) {
            e.score10 = rec.score10;
            e.rawScore = rec.score;
            boardDirty = true;
          }
        });
        if (rec.fbKey) LeaderboardEngine.patchScore(rec.fbKey, { score10: rec.score10, rawScore: rec.score });
      }

      function regradeAll(changed) {
        dirtyStats = {}; boardDirty = false;
        var res = { records: [], session: false };
        (RAM.historyRecords || []).forEach(function (rec) {
          var r = regradeRecord(rec, changed);
          if (r) { res.records.push(r); StorageEngine.putHistory(rec); syncBoard(rec); }
        });
        res.session = applyToSessions(changed);
        Object.keys(dirtyStats).forEach(function (uid) { StorageEngine.putStat(dirtyStats[uid]); });
        if (boardDirty) StorageEngine.saveLocalBoard();
        return res;
      }

      // ---------- Thông báo ----------
      function describe(q, a, b) {
        if (q && q.type === 'truefalse') {
          var parts = [];
          for (var i = 0; i < a.length && i < b.length; i++) {
            if (a.charAt(i) !== b.charAt(i)) {
              var id = (q.statements[i] && q.statements[i].id) || ['a', 'b', 'c', 'd'][i];
              parts.push('ý ' + id + ': ' + (a.charAt(i) === 'Đ' ? 'Đúng' : 'Sai') + ' → ' + (b.charAt(i) === 'Đ' ? 'Đúng' : 'Sai'));
            }
          }
          return parts.join(' • ');
        }
        return a + ' → ' + b;
      }

      function mergeNotice(changes, meta, res) {
        var now = Date.now();
        if (!notice) notice = { at: now, version: 0, updated: '', note: '', changes: [], scores: [], session: false };
        notice.at = now; notice.version = meta.version; notice.updated = meta.updated; notice.note = meta.note;
        changes.forEach(function (c) {
          var ex = null;
          notice.changes.forEach(function (x) { if (x.uid === c.uid) ex = x; });
          if (ex) ex.to = c.to; else notice.changes.push({ uid: c.uid, from: c.from, to: c.to });
        });
        notice.changes = notice.changes.filter(function (c) { return c.from !== c.to; });
        res.records.forEach(function (r) {
          var ex = null;
          notice.scores.forEach(function (x) { if (x.id === r.id) ex = x; });
          if (ex) ex.to = r.to; else notice.scores.push({ id: r.id, when: r.when, label: r.label, from: r.from, to: r.to });
        });
        notice.scores = notice.scores.filter(function (s) { return Math.abs(s.from - s.to) > 0.0001; });
        notice.session = notice.session || res.session;
        if (!notice.changes.length) { notice = null; lsSet(LS_NOTICE, null); renderNotice(); return false; }
        lsSet(LS_NOTICE, notice);
        renderNotice();
        return true;
      }

      function renderNotice() {
        var root = document.getElementById('ak-notice-root');
        if (!root) return;
        if (!notice) { root.innerHTML = ''; return; }
        var n = notice;
        var items = n.changes.slice(0, 15).map(function (c) {
          var q = CATALOG_MAP[c.uid];
          var title = q ? String(q.question).replace(/\s+/g, ' ').slice(0, 64) + (q.question.length > 64 ? '…' : '') : '';
          return '<li><b>Câu #' + escapeHtml(c.uid) + '</b>' + (title ? ' <span class="ak-q">— ' + escapeHtml(title) + '</span>' : '') +
            '<div class="ak-diff">' + escapeHtml(describe(q, c.from, c.to)) + '</div></li>';
        }).join('');
        if (n.changes.length > 15) items += '<li>… và ' + (n.changes.length - 15) + ' câu khác</li>';
        var scoreHtml = n.scores.slice(0, 5).map(function (s) {
          return '<li>' + escapeHtml(formatDateTime(s.when)) + ' • ' + escapeHtml(s.label) + ': <b>' + Number(s.from).toFixed(2) + ' → ' + Number(s.to).toFixed(2) + '</b></li>';
        }).join('');
        var meta = [];
        if (n.version) meta.push('Phiên bản ' + n.version);
        if (n.updated) meta.push(n.updated);
        meta.push('nhận lúc ' + clock(n.at));
        root.innerHTML =
          '<div class="ak-card" role="alert">' +
            '<div class="ak-title">📢 Đáp án vừa được cập nhật</div>' +
            '<div class="ak-sub">' + escapeHtml(meta.join(' • ')) + '</div>' +
            (n.note ? '<div class="ak-line">📝 ' + escapeHtml(n.note) + '</div>' : '') +
            '<div class="ak-line"><b>' + n.changes.length + '</b> câu đã đổi đáp án và đã được đồng bộ vào bài của bạn.</div>' +
            (n.session ? '<div class="ak-line">✅ Bài đang làm dở của bạn đã được chấm lại theo đáp án mới.</div>' : '') +
            (n.scores.length ? '<div class="ak-line">📊 ' + n.scores.length + ' lượt làm trong Lịch sử đã được tính lại điểm.</div>' : '') +
            '<details class="ak-more"><summary>Xem chi tiết các câu thay đổi</summary><ul>' + items + '</ul>' +
              (scoreHtml ? '<div class="ak-sub" style="margin-top:8px;">Điểm trước → sau:</div><ul>' + scoreHtml + '</ul>' : '') +
            '</details>' +
            '<button type="button" class="btn-capsule" data-ak="dismiss" style="margin-top:10px;padding:11px 16px;font-size:14px;">✔ Đã hiểu</button>' +
          '</div>';
      }

      function updateStatus() {
        var el = document.getElementById('ak-status');
        if (el) el.textContent = statusText();
      }
      function statusText() {
        var t = '📋 Đáp án' + (cur.version ? ' v' + cur.version : '');
        if (lastOkAt) t += ' • đồng bộ ' + clock(lastOkAt);
        return t;
      }

      function refreshUi() {
        try { renderShell(); } catch (_) {}
        updateStatus();
      }

      // Có đáp án đổi: chấm lại bài, báo cho người dùng
      function handleChanges(changes, meta, withUi) {
        var changed = {};
        changes.forEach(function (c) { changed[c.uid] = true; });
        var res = regradeAll(changed);
        var show = mergeNotice(changes, meta, res);
        if (show) {
          showToast('📢 Đáp án vừa được cập nhật: ' + changes.length + ' câu thay đổi', 'ok', 3800);
          vibrateDevice([30, 60, 30]);
        }
        if (withUi) refreshUi();
      }

      // ---------- Đồng bộ từ GitHub ----------
      function sourceUrl() {
        if (AK_SYNC_SOURCE && /^https?:\/\//i.test(AK_SYNC_SOURCE)) return AK_SYNC_SOURCE;
        if (/^https?:$/.test(location.protocol)) return location.origin + location.pathname;
        return '';
      }

      // Chỉ tải ~40KB cuối file (khung đáp án nằm ở cuối) để tiết kiệm dữ liệu; nếu máy chủ không hỗ trợ thì tải đủ
      function fetchKeyText(url, useRange) {
        var u = url + (url.indexOf('?') === -1 ? '?' : '&') + '_ak=' + Date.now();
        var opts = { cache: 'no-store' };
        if (useRange) opts.headers = { 'Range': 'bytes=-40000' };
        return fetch(u, opts).then(function (r) {
          if (!r.ok) throw new Error('HTTP ' + r.status);
          return r.text();
        }).then(function (html) {
          var m = html.match(KEY_RE);
          if (!m) throw new Error('NOKEY');
          return m[1];
        });
      }

      function onRemoteText(text, manual) {
        var p = parseText(text);
        lastOkAt = Date.now();
        if (p.version < cur.version) { // bản cũ hơn (CDN chưa kịp cập nhật) -> bỏ qua
          if (manual) showToast('✅ Đáp án đang là bản mới nhất (v' + cur.version + ')', 'ok', 1800);
          return;
        }
        lsSet(LS_REMOTE, { text: text, version: p.version, savedAt: Date.now() });
        if (p.hash === cur.hash) {
          cur.version = p.version; cur.updated = p.updated; cur.note = p.note;
          if (manual) showToast('✅ Đáp án đang là bản mới nhất' + (cur.version ? ' (v' + cur.version + ')' : ''), 'ok', 1800);
          return;
        }
        var changes = applyParsed(p, 'remote');
        if (changes.length) handleChanges(changes, p, true);
        else if (manual) showToast('🔄 Đã cập nhật khung đáp án (không có câu nào đổi đáp án)', 'ok', 2200);
      }

      function checkNow(manual) {
        var url = sourceUrl();
        if (!url) {
          if (manual) showToast('ℹ️ Chỉ đồng bộ được khi mở file bằng link https (GitHub Pages)', '', 2600);
          return Promise.resolve();
        }
        if (checking) return Promise.resolve();
        checking = true;
        lastTry = Date.now();
        return fetchKeyText(url, true)
          .catch(function () { return fetchKeyText(url, false); })
          .then(function (text) { onRemoteText(text, manual); })
          .catch(function () { if (manual) showToast('📡 Chưa kiểm tra được đáp án mới (mất mạng hoặc link chưa cập nhật)', 'bad', 2400); })
          .then(function () { checking = false; updateStatus(); });
      }

      function readEmbeddedText() {
        var el = document.getElementById('answer-key');
        return el ? el.textContent : '';
      }

      function boot() {
        try {
          var stored = lsGet(LS_SIGS);
          sigs = (stored && stored.sigs && typeof stored.sigs === 'object') ? stored.sigs : {};
          notice = lsGet(LS_NOTICE);
          var emb = parseText(readEmbeddedText());
          var pick = emb, src = 'embedded';
          // Nếu lần trước đã tải được bản mới hơn từ GitHub mà file đang mở là bản cũ (cache) thì dùng bản mới đó, tránh nhảy qua nhảy lại
          var rem = lsGet(LS_REMOTE);
          if (rem && typeof rem.text === 'string') {
            var rp = parseText(rem.text);
            if (rp.version >= emb.version && rp.hash !== emb.hash) { pick = rp; src = 'cache'; }
          }
          var changes = applyParsed(pick, src);
          if (changes.length) handleChanges(changes, pick, false);
          else if (notice) renderNotice();
          if (location.protocol === 'file:' && cur.errors.length) {
            showToast('⚠️ Khung đáp án có ' + cur.errors.length + ' dòng chưa hợp lệ (xem Console)', 'bad', 3500);
          }
        } catch (err) {
          try { console.warn('[Khung đáp án] lỗi khởi tạo', err); } catch (_) {}
        }
      }

      function start() {
        updateStatus();
        if (pollTimer) return;
        setTimeout(function () { checkNow(false); }, 1200);
        pollTimer = setInterval(function () {
          if (document.visibilityState !== 'hidden') checkNow(false);
        }, AK_POLL_MS);
        document.addEventListener('visibilitychange', function () {
          if (document.visibilityState === 'visible' && Date.now() - lastTry > 10000) checkNow(false);
        });
        window.addEventListener('online', function () { checkNow(false); });
        var root = document.getElementById('ak-notice-root');
        if (root) {
          root.addEventListener('click', function (ev) {
            var b = ev.target && ev.target.closest ? ev.target.closest('[data-ak="dismiss"]') : null;
            if (!b) return;
            notice = null;
            lsSet(LS_NOTICE, null);
            renderNotice();
          });
        }
      }

      return {
        /*AK_EXPORT*/
        boot: boot,
        start: start,
        checkNow: checkNow,
        statusText: statusText,
        reconcileSession: function (sess) { return reconcileSession(sess, null); }
      };
    })();

    // =========================================================================
    // PHẦN 10: KHỞI CHẠY ỨNG DỤNG AN TOÀN SAU KHI DOM SẴN SÀNG
    // =========================================================================
    document.addEventListener('DOMContentLoaded', function () {
      // Đọc cờ lite từ localStorage NGAY (trước rippleInit/lensFilter) để máy yếu không phải dựng hiệu ứng nặng lúc mở trang
      try { var _ls = JSON.parse(localStorage.getItem(lgqKey('lgq_settings_v1')) || 'null'); if (_ls && _ls.lite) RAM.settings.lite = true; } catch (_) {}
      applyLite();
      lensFilter();
      rippleInit();
      Scratchpad.init();
      bindGlobalEvents();
      bindTfSliders();
      try {
        if (window.ResizeObserver) {
          var qbRO = new ResizeObserver(function () { requestAnimationFrame(syncQuizBars); });
          ['quiz-bar-top', 'quiz-bar-bottom'].forEach(function (id) { var el = document.getElementById(id); if (el) qbRO.observe(el); });
        }
      } catch (_) {}
      window.addEventListener('resize', syncQuizBars);

      StorageEngine.boot().then(function () {
        applyTheme(); applyFontScale(); applyLite();
        AnswerKey.boot();
        LeaderboardEngine.fetchEntries(false);
        renderShell();
        openResumePromptIfAvailable();
        AnswerKey.start();
      });
    });
  })();
  </script>

  <script>
  /* NÂNG CẤP v2 — xử lý cuộn nhẹ: cờ is-scrolling, ẩn/hiện thanh chức năng khi làm bài */
  (function () {
    var root = document.documentElement, lastY = 0, acc = 0, hidden = false, ticking = false, idleT = 0, chipT = 0, chip = null;
    function chipText() {
      var t = document.getElementById('quiz-live-timer');
      var n = document.querySelector('.quiz-top-bar > div:first-child > span:nth-child(2)');
      return (t ? t.textContent : '') + (n ? ' · ' + n.textContent.replace('Câu ', '') : '') + ' ▾';
    }
    function setHidden(v) {
      if (v === hidden) return;
      hidden = v;
      root.classList.toggle('qbar-hidden', v);
      clearInterval(chipT);
      if (v) {
        if (!chip) {
          chip = document.createElement('button');
          chip.type = 'button';
          chip.className = 'btn-pill pill-sm qbar-peek';
          chip.setAttribute('aria-label', 'Hiện thanh chức năng');
          chip.addEventListener('click', function () { acc = 0; setHidden(false); });
          document.body.appendChild(chip);
        }
        chip.textContent = chipText();
        chipT = setInterval(function () { chip.textContent = chipText(); }, 1000);
      }
    }
    function step() {
      ticking = false;
      var y = window.pageYOffset || root.scrollTop || 0, dy = y - lastY;
      lastY = y;
      if (!root.classList.contains('in-quiz')) { if (hidden) setHidden(false); return; }
      if (y <= 24) { acc = 0; setHidden(false); return; }
      acc = ((dy > 0) === (acc > 0)) ? acc + dy : dy;
      if (acc > 14) setHidden(true);
      else if (acc < -10) setHidden(false);
    }
    function dragOn(e) { var t = e.target; if (t && t.closest && t.closest('.lg[data-lg], .tf-sl')) root.classList.add('sl-drag'); }
    function dragOff() { root.classList.remove('sl-drag'); }
    document.addEventListener('pointerdown', dragOn, { capture: true, passive: true });
    document.addEventListener('pointerup', dragOff, { capture: true, passive: true });
    document.addEventListener('pointercancel', dragOff, { capture: true, passive: true });
    window.addEventListener('blur', dragOff);
    window.addEventListener('scroll', function () {
      if (!root.classList.contains('is-scrolling')) root.classList.add('is-scrolling');
      clearTimeout(idleT);
      idleT = setTimeout(function () { root.classList.remove('is-scrolling'); }, 140);
      if (!ticking) { ticking = true; requestAnimationFrame(step); }
    }, { passive: true });
  })();
  </script>
