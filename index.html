        if (elapsed < 135) {
          var dt = elapsed / 135;
          var hop = Math.sin(dt * Math.PI) * 3.2;
          var dropR = Math.max(0.9, 2.0 * (1 - dt * 0.45));
          var dropAl = (1 - dt) * 0.78;
          var dyPos = rp.y - hop;

          var dGrad = rpCtx.createRadialGradient(
            rp.x - dropR * 0.3, dyPos - dropR * 0.3, 0.1,
            rp.x, dyPos, dropR * 1.4
          );
          dGrad.addColorStop(0, 'rgba(255, 248, 230, ' + (0.90 * dropAl).toFixed(4) + ')');
          dGrad.addColorStop(0.55, 'rgba(125, 218, 255, ' + (0.42 * dropAl).toFixed(4) + ')');
          dGrad.addColorStop(1, 'rgba(56, 189, 248, 0)');

          rpCtx.beginPath();
          rpCtx.arc(rp.x, dyPos, dropR * 1.4, 0, Math.PI * 2);
          rpCtx.fillStyle = dGrad;
          rpCtx.fill();
        }
      }

      if (bx1 > bx0) {
        rpDirty = { x0: Math.max(0, Math.floor(bx0)), y0: Math.max(0, Math.floor(by0)), x1: Math.min(rpCssW, Math.ceil(bx1)), y1: Math.min(rpCssH, Math.ceil(by1)) };
      }
      if (activeRipples.length > 0) {
        rpRafId = requestAnimationFrame(rpTick);
      } else {
        rpRafId = 0;
        // Khung cuối: dọn sạch phần còn lại để không sót gợn sóng
        if (rpDirty) { rpCtx.clearRect(rpDirty.x0, rpDirty.y0, rpDirty.x1 - rpDirty.x0, rpDirty.y1 - rpDirty.y0); rpDirty = null; }
      }
    }

    function spawnRippleFromClient(clientX, clientY, targetEl) {
      if (!rpCanvas || isLite()) return;
      if (!rpWaveSprite && !rpSpriteTried) { rpSpriteTried = true; try { rpWaveSprite = buildRayTracedWaveSprite(); } catch (_) { rpWaveSprite = null; } }
      var scratchLayer = document.getElementById('scratch-layer');
      if (scratchLayer && !scratchLayer.classList.contains('hidden')) {
        if (!targetEl || !targetEl.closest || !targetEl.closest('#scratch-dock')) return;
      }
      var rect = rpCanvas.getBoundingClientRect();
      if (rect.width <= 0 || rect.height <= 0) return;
      if (Math.abs(rect.width - rpCssW) > 1 || Math.abs(rect.height - rpCssH) > 1) {
        resizeRippleCanvas();
        rect = rpCanvas.getBoundingClientRect();
      }
      var x = clientX - rect.left;
      var y = clientY - rect.top;

      activeRipples.push({
        x: x,
        y: y,
        t0: performance.now(),
        maxR: 28, // Nhỏ nhắn tinh tế đúng điểm chạm, không bao giờ che khuất chữ
        dur: 760
      });
      if (activeRipples.length > 16) activeRipples.shift();
      if (!rpRafId) rpRafId = requestAnimationFrame(rpTick);
    }

    function rippleInit() {
      rpCanvas = document.getElementById('liquid-ripples');
      if (!rpCanvas) return;
      rpCtx = rpCanvas.getContext('2d');
      if (!isLite()) { rpSpriteTried = true; try { rpWaveSprite = buildRayTracedWaveSprite(); } catch (_) { rpWaveSprite = null; } }
      resizeRippleCanvas();

      window.addEventListener('resize', resizeRippleCanvas, { passive: true });
      if (window.visualViewport) {
        window.visualViewport.addEventListener('resize', resizeRippleCanvas, { passive: true });
      }

      // Bắt trực tiếp touchstart gốc của màn hình cảm ứng để tọa độ khớp 100% vị trí ngón tay
      document.addEventListener('touchstart', function (ev) {
        if (!ev.changedTouches || ev.changedTouches.length === 0) return;
        rpLastTouchTs = performance.now();
        for (var i = 0; i < ev.changedTouches.length; i++) {
          var tch = ev.changedTouches[i];
          spawnRippleFromClient(tch.clientX, tch.clientY, ev.target);
        }
      }, { passive: true });

      // Hỗ trợ chuột & bút cảm ứng trên máy tính (bỏ qua sự kiện giả lập sau touchstart)
      document.addEventListener('pointerdown', function (ev) {
        if (ev.pointerType === 'touch') return;
        if (performance.now() - rpLastTouchTs < 550) return;
        spawnRippleFromClient(ev.clientX, ev.clientY, ev.target);
      }, { passive: true });

      // Hiệu ứng phản xạ ánh sáng Fresnel theo góc trỏ chuột trên thẻ & nút kính
      var gmTarget = null, gmX = 0, gmY = 0, gmRaf = 0, gmType = '';
      document.addEventListener('pointermove', function (ev) {
        if (isLite() || document.documentElement.classList.contains('sl-drag')) return;
        gmType = ev.pointerType; gmTarget = ev.target; gmX = ev.clientX; gmY = ev.clientY;
        if (gmRaf) return;
        gmRaf = requestAnimationFrame(function () {
          gmRaf = 0;
          var glassEl = gmTarget && gmTarget.closest ? gmTarget.closest('.card, .chk, .opt, .btn-capsule') : null;
          if (!glassEl) return;
          var r = glassEl.getBoundingClientRect();
          if (gmType === 'touch' && r.height > window.innerHeight * 1.6) return; // thẻ rất dài: vẽ lại gradient toàn thẻ mỗi khung hình là quá tốn
          glassEl.style.setProperty('--mx', (gmX - r.left).toFixed(0) + 'px');
          glassEl.style.setProperty('--my', (gmY - r.top).toFixed(0) + 'px');
        });
      }, { passive: true });
    }

    // =========================================================================
    // PHẦN 3: HỆ THỐNG ÂM THANH DOPAMINE WEB AUDIO SYNTHESIZER (100% OFFLINE)
    // =========================================================================
    const AudioSynth = (function () {
      var audioCtx = null;
      var streakCount = 0;

      function ensureCtx() {
        if (!RAM.settings.sound) return null;
        var Ctor = window.AudioContext || window.webkitAudioContext;
        if (!Ctor) return null;
        if (!audioCtx) {
          try { audioCtx = new Ctor(); } catch (_) { return null; }
        }
        if (audioCtx.state === 'suspended') {
          audioCtx.resume().catch(function () {});
        }
        return audioCtx;
      }

      function playTone(ctx, freq, waveType, startTime, duration, peakGain) {
        var osc = ctx.createOscillator();
        var gain = ctx.createGain();
        osc.type = waveType;
        osc.frequency.setValueAtTime(freq, startTime);
        gain.gain.setValueAtTime(0.0001, startTime);
        gain.gain.linearRampToValueAtTime(peakGain, startTime + 0.012);
        gain.gain.exponentialRampToValueAtTime(0.0001, startTime + duration);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start(startTime);
        osc.stop(startTime + duration + 0.015);
      }

      return {
        getStreak: function () { return streakCount; },
        resetStreak: function () { streakCount = 0; },

        tap: function () {
          var ctx = ensureCtx();
          if (!ctx) return;
          var t0 = ctx.currentTime;
          var osc = ctx.createOscillator();
          var gain = ctx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(800, t0);
          osc.frequency.exponentialRampToValueAtTime(520, t0 + 0.015);
          gain.gain.setValueAtTime(0.06, t0);
          gain.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.016);
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start(t0);
          osc.stop(t0 + 0.02);
        },

        correct: function () {
          streakCount += 1;
          AppState.auraLevel = streakCount >= 5 ? 2 : (streakCount >= 3 ? 1 : 0); // Streak Aura (đọc 1 lần ở renderQuizView)
          var ctx = ensureCtx();
          if (!ctx) return;
          var pitch = Math.min(1.25, 1 + (streakCount - 1) * 0.03);
          var notes = [587.33, 783.99, 1046.50];
          var t0 = ctx.currentTime;
          for (var i = 0; i < notes.length; i++) {
            var st = t0 + i * 0.072;
            playTone(ctx, notes[i] * pitch, 'sine', st, 0.21, 0.13);
            playTone(ctx, notes[i] * pitch, 'triangle', st, 0.17, 0.055);
          }
          // Nốt kim cương cao vút khi đạt chuỗi >= 5 câu đúng liên tiếp
          if (streakCount >= 5) {
            playTone(ctx, 1567.98 * pitch, 'sine', t0 + 0.215, 0.28, 0.11);
          }
        },

        wrong: function () {
          streakCount = 0;
          AppState.auraLevel = 0;
          var ctx = ensureCtx();
          if (!ctx) return;
          var t0 = ctx.currentTime;
          playTone(ctx, 220.00, 'triangle', t0, 0.12, 0.12);
          playTone(ctx, 164.81, 'triangle', t0 + 0.105, 0.15, 0.11);
        },

        victory: function () {
          var ctx = ensureCtx();
          if (!ctx) return;
          var fanfare = [523.25, 659.25, 783.99, 1046.50];
          var t0 = ctx.currentTime;
          for (var i = 0; i < fanfare.length; i++) {
            var dur = i === 3 ? 0.42 : 0.16;
            playTone(ctx, fanfare[i], 'sine', t0 + i * 0.095, dur, 0.14);
            playTone(ctx, fanfare[i], 'triangle', t0 + i * 0.095, dur * 0.85, 0.06);
          }
        }
      };
    })();

    // =========================================================================
    // PHẦN 4: HỆ THỐNG LƯU TRỮ VÔ HẠN (INDEXEDDB + RAM CACHE 0MS + PERSIST)
    // =========================================================================
    const RAM = {
      settings: {
        playerName: '',
        mode: 'practice', // 'practice' | 'exam'
        examMinutes: 45,
        shuffle: true,
        sound: true,
        oneHand: false,
        theme: 'dark',   // 'dark' | 'light' | 'auto'
        fontScale: 1,    // cỡ chữ lúc làm bài (A- / A+)
        focus: false,    // Chế độ Tập trung (Zen)
        lite: false,     // Chế độ siêu tối giản cho máy yếu
        selectedLessons: LESSONS.map(function (l) { return l.title; }),
        selectedTypes: ['single', 'truefalse', 'short']
      },
      bookmarks: {},      // { [uid]: 'star' | 'warn' }
      notes: {},          // { [uid]: 'string' }
      stats: {},          // { [uid]: { qId, attempts, wrongs, lastWrongAt } }
      historyRecords: [], // Normalized attempts
      localBoard: [],     // Local fallback leaderboard
      activeSession: null // Full auto-save resume snapshot
    };

    const StorageEngine = (function () {
      var DB_NAME = 'CrystalLiquidQuizDB_v1@' + window.LGQ_NS;
      var DB_VER = 1;
      var dbHandle = null;
      var LS_SETTINGS = lgqKey('lgq_settings_v1');
      var LS_SESSION = lgqKey('lgq_active_session_v1');
      var LS_FALLBACK = lgqKey('lgq_fallback_bundle_v1');

      function requestPersistentQuota() {
        try {
          if (navigator.storage && typeof navigator.storage.persist === 'function') {
            navigator.storage.persist().catch(function () {});
          }
        } catch (_) {}
      }

      function safeLsGet(k) {
        try {
          var raw = localStorage.getItem(k);
          return raw ? JSON.parse(raw) : null;
        } catch (_) {
          return null;
        }
      }

      function safeLsSet(k, v) {
        try {
          if (v === null || v === undefined) localStorage.removeItem(k);
          else localStorage.setItem(k, JSON.stringify(v));
        } catch (_) {}
      }

      function openDb() {
        return new Promise(function (resolve) {
          if (!window.indexedDB) {
            resolve(null);
            return;
          }
          try {
            var req = window.indexedDB.open(DB_NAME, DB_VER);
            req.onupgradeneeded = function (ev) {
              var db = ev.target.result;
              if (!db.objectStoreNames.contains('meta')) {
                db.createObjectStore('meta', { keyPath: 'k' });
              }
              if (!db.objectStoreNames.contains('stats')) {
                db.createObjectStore('stats', { keyPath: 'qId' });
              }
              if (!db.objectStoreNames.contains('history')) {
                db.createObjectStore('history', { keyPath: 'id' });
              }
            };
            req.onsuccess = function (ev) {
              dbHandle = ev.target.result;
              resolve(dbHandle);
            };
            req.onerror = function () { resolve(null); };
          } catch (_) {
            resolve(null);
          }
        });
      }

      function readAllStore(storeName) {
        return new Promise(function (resolve) {
          if (!dbHandle) { resolve([]); return; }
          try {
            var tx = dbHandle.transaction(storeName, 'readonly');
            var req = tx.objectStore(storeName).getAll();
            req.onsuccess = function () { resolve(req.result || []); };
            req.onerror = function () { resolve([]); };
          } catch (_) {
            resolve([]);
          }
        });
      }

      function putStoreItem(storeName, val) {
        if (!dbHandle) {
          syncFallbackBundle();
          return;
        }
        try {
          var tx = dbHandle.transaction(storeName, 'readwrite');
          tx.objectStore(storeName).put(val);
        } catch (_) {}
      }

      function deleteStoreItem(storeName, key) {
        if (!dbHandle) {
          syncFallbackBundle();
          return;
        }
        try {
          var tx = dbHandle.transaction(storeName, 'readwrite');
          tx.objectStore(storeName).delete(key);
        } catch (_) {}
      }

      function clearStore(storeName) {
        if (!dbHandle) return;
        try {
          var tx = dbHandle.transaction(storeName, 'readwrite');
          tx.objectStore(storeName).clear();
        } catch (_) {}
      }

      function syncFallbackBundle() {
        safeLsSet(LS_FALLBACK, {
          bookmarks: RAM.bookmarks,
          notes: RAM.notes,
          stats: RAM.stats,
          historyRecords: RAM.historyRecords.slice(0, 120),
          localBoard: RAM.localBoard.slice(0, 100)
        });
      }

      return {
        boot: function () {
          requestPersistentQuota();

          // Khôi phục tức thì từ LocalStorage trong lúc mở IndexedDB
          var lsSettings = safeLsGet(LS_SETTINGS);
          if (lsSettings && typeof lsSettings === 'object') {
            Object.assign(RAM.settings, lsSettings);
          }
          var lsSession = safeLsGet(LS_SESSION);
          if (lsSession && Array.isArray(lsSession.items) && lsSession.items.length > 0) {
            RAM.activeSession = lsSession;
          }
          var fbBundle = safeLsGet(LS_FALLBACK);
          if (fbBundle) {
            RAM.bookmarks = fbBundle.bookmarks || {};
            RAM.notes = fbBundle.notes || {};
            RAM.stats = fbBundle.stats || {};
            RAM.historyRecords = Array.isArray(fbBundle.historyRecords) ? fbBundle.historyRecords : [];
            RAM.localBoard = Array.isArray(fbBundle.localBoard) ? fbBundle.localBoard : [];
          }

          return openDb().then(function (db) {
            if (!db) return;
            return Promise.all([
              readAllStore('meta'),
              readAllStore('stats'),
              readAllStore('history')
            ]).then(function (res) {
              var metaRows = res[0] || [];
              var statRows = res[1] || [];
              var histRows = res[2] || [];

              metaRows.forEach(function (row) {
                if (row.k === 'settings' && row.v) Object.assign(RAM.settings, row.v);
                if (row.k === 'bookmarks' && row.v) RAM.bookmarks = row.v;
                if (row.k === 'notes' && row.v) RAM.notes = row.v;
                if (row.k === 'localBoard' && Array.isArray(row.v)) RAM.localBoard = row.v;
                if (row.k === 'activeSession' && row.v && !RAM.activeSession) {
                  RAM.activeSession = row.v;
                }
              });

              if (statRows.length > 0) {
                var mapS = {};
                statRows.forEach(function (s) { mapS[s.qId] = s; });
                RAM.stats = mapS;
              }

              if (histRows.length > 0) {
                histRows.sort(function (a, b) { return (b.timestamp || 0) - (a.timestamp || 0); });
                RAM.historyRecords = histRows;
              }

              // Đảm bảo bài học hợp lệ theo đề hiện tại
              var validLessonNames = LESSONS.map(function (l) { return l.title; });
              RAM.settings.selectedLessons = (RAM.settings.selectedLessons || []).filter(function (n) {
                return validLessonNames.indexOf(n) !== -1;
              });
              if (RAM.settings.selectedLessons.length === 0) {
                RAM.settings.selectedLessons = validLessonNames.slice();
              }
            });
          });
        },

        saveSettings: function () {
          safeLsSet(LS_SETTINGS, RAM.settings);
          putStoreItem('meta', { k: 'settings', v: RAM.settings });
        },

        saveBookmarks: function () {
          putStoreItem('meta', { k: 'bookmarks', v: RAM.bookmarks });
          if (!dbHandle) syncFallbackBundle();
        },

        saveNotes: function () {
          putStoreItem('meta', { k: 'notes', v: RAM.notes });
          if (!dbHandle) syncFallbackBundle();
        },

        recordQuestionOutcome: function (qId, isWrong) {
          var key = String(qId);
          var cur = RAM.stats[key] || { qId: key, attempts: 0, wrongs: 0, lastWrongAt: 0 };
          cur.attempts += 1;
          if (isWrong) {
            cur.wrongs += 1;
            cur.lastWrongAt = Date.now();
          }
          RAM.stats[key] = cur;
          putStoreItem('stats', cur);
        },

        addHistoryAttempt: function (record) {
          RAM.historyRecords.unshift(record);
          putStoreItem('history', record);
          if (!dbHandle) syncFallbackBundle();
        },

        putHistory: function (rec) {
          putStoreItem('history', rec);
        },

        putStat: function (st) {
          putStoreItem('stats', st);
        },

        clearHistory: function () {
          RAM.historyRecords = [];
          clearStore('history');
          syncFallbackBundle();
        },

        saveLocalBoard: function () {
          putStoreItem('meta', { k: 'localBoard', v: RAM.localBoard });
          syncFallbackBundle();
        },

        saveActiveSession: function (sess) {
          cancelPendingPersist();
          RAM.activeSession = sess;
          safeLsSet(LS_SESSION, sess);
          if (sess) {
            putStoreItem('meta', { k: 'activeSession', v: sess });
          } else {
            deleteStoreItem('meta', 'activeSession');
          }
        },

        exportBackupJson: function () {
          var payload = {
            schema: 'CrystalLiquidQuizBackup_v1',
            exportedAt: Date.now(),
            settings: RAM.settings,
            bookmarks: RAM.bookmarks,
            notes: RAM.notes,
            stats: RAM.stats,
            historyRecords: RAM.historyRecords,
            localBoard: RAM.localBoard
          };
          var blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
          var url = URL.createObjectURL(blob);
          var link = document.createElement('a');
          var dateStr = new Date().toISOString().slice(0, 10);
          link.href = url;
          link.download = 'sao-luu-trac-nghiem-' + dateStr + '.json';
          document.body.appendChild(link);
          link.click();
          document.body.removeChild(link);
          setTimeout(function () { URL.revokeObjectURL(url); }, 1500);
        },

        importBackupJson: function (jsonText) {
          var parsed = JSON.parse(jsonText);
          if (!parsed || typeof parsed !== 'object') throw new Error('File JSON không hợp lệ');

          if (parsed.settings && typeof parsed.settings === 'object') {
            Object.assign(RAM.settings, parsed.settings);
            this.saveSettings();
          }
          if (parsed.bookmarks && typeof parsed.bookmarks === 'object') {
            Object.assign(RAM.bookmarks, parsed.bookmarks);
            this.saveBookmarks();
          }
          if (parsed.notes && typeof parsed.notes === 'object') {
            Object.assign(RAM.notes, parsed.notes);
            this.saveNotes();
          }
          if (parsed.stats && typeof parsed.stats === 'object') {
            Object.keys(parsed.stats).forEach(function (k) {
              RAM.stats[k] = parsed.stats[k];
              putStoreItem('stats', RAM.stats[k]);
            });
          }
          if (Array.isArray(parsed.historyRecords)) {
            var existingIds = {};
            RAM.historyRecords.forEach(function (h) { existingIds[h.id] = true; });
            parsed.historyRecords.forEach(function (h) {
              if (h && h.id && !existingIds[h.id]) {
                RAM.historyRecords.push(h);
                putStoreItem('history', h);
              }
            });
            RAM.historyRecords.sort(function (a, b) { return (b.timestamp || 0) - (a.timestamp || 0); });
          }
          if (Array.isArray(parsed.localBoard)) {
            RAM.localBoard = parsed.localBoard;
            this.saveLocalBoard();
          }
          syncFallbackBundle();
        }
      };
    })();

    // =========================================================================
    // PHẦN 5: BẢNG XẾP HẠNG REALTIME ONLINE (FIREBASE REST + GRACEFUL FALLBACK)
    // =========================================================================
    const LeaderboardEngine = (function () {
      var cleanUrl = String(FIREBASE_URL || '').trim().replace(/\/+$/, '');
      var isConfigured = /^https:\/\//i.test(cleanUrl) && cleanUrl.indexOf('DÁN_LINK_FIREBASE') === -1;
      var onlineActive = false;
      var remoteEntries = [];
      var pollTimer = 0;
      var bcChannel = null;

      try {
        if (typeof window.BroadcastChannel === 'function') {
          bcChannel = new BroadcastChannel(lgqKey('lgq_leaderboard_live_v1'));
          bcChannel.onmessage = function () {
            if (AppState.tab === 'leaderboard') fetchEntries(true);
          };
        }
      } catch (_) {}

      function updateBadgeUI(isOnline, labelText) {
        onlineActive = isOnline;
        var dot = document.getElementById('sync-dot');
        var lbl = document.getElementById('sync-label');
        if (dot) dot.className = 'sync-dot' + (isOnline ? ' online' : '');
        if (lbl) lbl.textContent = labelText;
      }

      function fetchWithTimeout(url, opts, timeoutMs) {
        return new Promise(function (resolve, reject) {
          var ctrl = typeof AbortController === 'function' ? new AbortController() : null;
          var timer = setTimeout(function () {
            if (ctrl) ctrl.abort();
            reject(new Error('Timeout'));
          }, timeoutMs || 6500);

          var fetchOpts = Object.assign({}, opts || {});
          if (ctrl) fetchOpts.signal = ctrl.signal;

          fetch(url, fetchOpts).then(function (res) {
            clearTimeout(timer);
            if (!res.ok) throw new Error('HTTP ' + res.status);
            return res.json();
          }).then(resolve).catch(function (err) {
            clearTimeout(timer);
            reject(err);
          });
        });
      }

      function fetchEntries(renderAfter) {
        if (!isConfigured) {
          updateBadgeUI(false, 'Offline Local');
          if (renderAfter && AppState.tab === 'leaderboard') renderLeaderboardListOnly();
          return Promise.resolve(RAM.localBoard);
        }

        return fetchWithTimeout(cleanUrl + '/leaderboard.json', { method: 'GET' }, 6500)
          .then(function (data) {
            var list = [];
            if (data && typeof data === 'object') {
              Object.keys(data).forEach(function (k) {
                if (data[k] && typeof data[k] === 'object') {
                  list.push(Object.assign({ fbKey: k }, data[k]));
                }
              });
            }
            remoteEntries = list;
            updateBadgeUI(true, 'Online Realtime');
            if (renderAfter && AppState.tab === 'leaderboard') renderLeaderboardListOnly();
            return list;
          })
          .catch(function () {
            updateBadgeUI(false, 'Chế độ Offline');
            if (renderAfter && AppState.tab === 'leaderboard') renderLeaderboardListOnly();
            return RAM.localBoard;
          });
      }

      function submitScore(entry) {
        // Luôn lưu bản sao trên máy để không bao giờ mất điểm
        RAM.localBoard.unshift(entry);
        if (RAM.localBoard.length > 200) RAM.localBoard.length = 200;
        StorageEngine.saveLocalBoard();
        if (bcChannel) { try { bcChannel.postMessage({ type: 'new_score' }); } catch (_) {} }

        if (!isConfigured) {
          updateBadgeUI(false, 'Offline Local');
          return Promise.resolve({ mode: 'local' });
        }

        return fetchWithTimeout(cleanUrl + '/leaderboard.json', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(entry)

    function shuffleArray(arr) {
      var copy = arr.slice();
      for (var i = copy.length - 1; i > 0; i--) {
        var j = Math.floor(Math.random() * (i + 1));

        copy[i] = copy[j];
        copy[j] = tmp;

    // Tạo đề thi đã nhân bản sâu (Deep Clone), cố định thứ tự Phần I (single) -> Phần II (truefalse) -> Phần III (short)
    // và chỉ trộn ngẫu nhiên câu hỏi bên trong từng phần + ánh xạ chỉ số gốc chính xác 100%
    function buildQuizItems(sourceQuestions, doShuffle) {
      var partSingle = [];
      var partTrueFalse = [];
      var partShort = [];

      sourceQuestions.forEach(function (q) {
        if (q.type === 'single') partSingle.push(q);
        else if (q.type === 'truefalse') partTrueFalse.push(q);
        else partShort.push(q);
      });

      if (doShuffle) {
        partSingle = shuffleArray(partSingle);
        partTrueFalse = shuffleArray(partTrueFalse);
        partShort = shuffleArray(partShort);
      }

      var list = partSingle.concat(partTrueFalse, partShort);
      return list.map(function (q) {
        if (q.type === 'single') {
          var optObjs = q.options.map(function (txt, origIdx) {
            return { text: txt, origIdx: origIdx };
          });
          if (doShuffle) optObjs = shuffleArray(optObjs);
          var mappedCorrect = 0;
          for (var i = 0; i < optObjs.length; i++) {
            if (optObjs[i].origIdx === q.correct) {
              mappedCorrect = i;
              break;
            }
          }
          return {
            uid: q.uid,
            type: 'single',
            optOrder: optObjs.map(function (o) { return o.origIdx; }),
            correctIdx: mappedCorrect,
            picked: null,
            checked: false,
            eliminated: [],
            triedWrong: []
          };
        }

        if (q.type === 'truefalse') {
          var stObjs = q.statements.map(function (st, sIdx) {
            return { origIdx: sIdx, id: st.id, correct: st.correct };
          });
          if (doShuffle) stObjs = shuffleArray(stObjs);
          return {
            uid: q.uid,
            type: 'truefalse',
            stOrder: stObjs.map(function (s) { return s.origIdx; }),
            picks: [null, null, null, null], // boolean | null cho 4 ý hiển thị a, b, c, d
            checked: false
          };
        }

        return {
          uid: q.uid,
          type: 'short',
          inputText: '',
          checked: false
        };
      });
    }

    var SLOW_CORRECT_MS = 90 * 1000;   // đúng nhưng mất > 90 giây -> đánh dấu chậm
    var STUCK_WARN_MS = 120 * 1000;    // Phòng thi: dừng > 2 phút ở 1 câu -> cảnh báo nhẹ
    function sessionElapsedNow() {
      if (!S) return 0;
      var cur = S.elapsedMs || 0;
      if (S.clockRunning && S.lastResumeTs) cur += Math.max(0, Math.min(Date.now() - S.lastResumeTs, 3600000));

    }
    // Chuyển phần thời gian vừa trôi qua vào đúng câu đang được tính (câu cũ), rồi đặt mốc cho câu hiện tại

    // Tạm dừng đồng hồ tích lũy thời gian thực khi ẩn tab / thoát ra ngoài
    function flushSessionElapsed(pauseClock) {

    // ngay trên luồng chính, trước cả khi vẽ -> trễ khi bấm. Nay gom lại: tính đồng hồ ngay (rẻ), còn ghi đĩa thì

    // =========================================================================
    // PHẦN 7: LOGIC CHẤM ĐIỂM CHUẨN HÓA & HOÀN THÀNH BÀI THI
    // =========================================================================
    function evaluateQuizItem(item) {
      var q = CATALOG_MAP[item.uid];
      if (!q) return { isFullCorrect: false, pts: 0, maxPts: 1 };

      if (item.type === 'single') {
        var ok = item.picked !== null && item.picked === item.correctIdx;
        return { isFullCorrect: ok, pts: ok ? 1.0 : 0, maxPts: 1.0 };
      }

      if (item.type === 'truefalse') {
        var rightCnt = 0;
        var allPicked = true;
        for (var i = 0; i < 4; i++) {
          var p = item.picks[i];
          if (p === null || p === undefined) {
            allPicked = false;
          } else {
            var origSt = q.statements[item.stOrder[i]];
            if (origSt && Boolean(p) === Boolean(origSt.correct)) rightCnt += 1;
          }
        }
        var pts = calcTrueFalsePoints(rightCnt);
        return {
          isFullCorrect: allPicked && rightCnt === 4,
          rightCnt: rightCnt,
          pts: pts,
          maxPts: 1.0
        };
      }

      var shortOk = isShortEqual(item.inputText, q.correct);
      return { isFullCorrect: shortOk, pts: shortOk ? 1.0 : 0, maxPts: 1.0 };
    }

    function isItemAnswered(item) {
      if (item.type === 'single') return item.picked !== null && item.picked !== undefined;
      if (item.type === 'truefalse') {
        return item.picks.every(function (p) { return p === true || p === false; });
      }
      return normalizeShortInput(item.inputText).length > 0;
    }

    // Ghi lại mỗi đáp án SAI mà người học đã chọn (theo thứ tự) để màn Xem lại hiển thị đủ hành trình tới khi chọn đúng
    function logWrongTry(item) {
      if (!item) return;
      if (!Array.isArray(item.tries)) item.tries = [];
      var snap;
      if (item.type === 'single') {
        if (item.picked === null || item.picked === undefined) return;
        if (item.picked === item.correctIdx) return;
        snap = item.picked;
        if (item.tries.indexOf(snap) !== -1) return;
      } else if (item.type === 'truefalse') {
        if (!item.picks.every(function (p) { return p === true || p === false; })) return;
        if (evaluateQuizItem(item).isFullCorrect) return;
        snap = item.picks.slice();
        var last = item.tries[item.tries.length - 1];
        if (last && JSON.stringify(last) === JSON.stringify(snap)) return;
      } else {
        snap = String(item.inputText || '').trim();
        if (!snap || isShortEqual(snap, (CATALOG_MAP[item.uid] || {}).correct)) return;
        if (item.tries.indexOf(snap) !== -1) return;
      }
      item.tries.push(snap);
    }

    function recordFirstAttemptIfNeeded(item, isFullCorrect) {
      if (!S.first) S.first = {};

      if (S.first[item.uid] === undefined) {

        StorageEngine.recordQuestionOutcome(item.uid, !isFullCorrect);
      }
    }

    function startNewQuizSession(questionPool, customLabel, forcedMode, noRank) {

      if (!hasValidPlayerName()) {
        askPlayerName(function () { startNewQuizSession(questionPool, customLabel, forcedMode, noRank); });
        return;
      }
      cancelAutoNext();
      AudioSynth.resetStreak();

      var activeMode = forcedMode || RAM.settings.mode || 'practice';
      var items = buildQuizItems(questionPool, Boolean(RAM.settings.shuffle));

      S = {
        sessionId: 'sess_' + Date.now(),
        label: customLabel || (RAM.settings.selectedLessons.length === 1 ? RAM.settings.selectedLessons[0] : 'Tổng hợp (' + items.length + ' câu)'),
        mode: activeMode,
        examMinutes: Number(RAM.settings.examMinutes) || 45,
        playerName: cleanPlayerName(RAM.settings.playerName) || 'Học viên ẩn danh',
        noRank: Boolean(noRank),
        items: items,
        curIdx: 0,
        first: {},
        firstPts: {},
        elapsedMs: 0,
        lastResumeTs: Date.now(),
        clockRunning: true,
        qMark: 0,
        qMarkIdx: 0,
        finished: false
      };

      StorageEngine.saveActiveSession(deepClone(S));
      AppState.screen = 'quiz';
      LeaderboardEngine.stopLiveSync();
      renderShell();
      startQuizTimerLoop();
    }

    function resumeSavedSession() {
      flushPendingPersist();
      if (!RAM.activeSession || !Array.isArray(RAM.activeSession.items) || RAM.activeSession.items.length === 0) return;
      cancelAutoNext();
      S = deepClone(RAM.activeSession);
      AnswerKey.reconcileSession(S);
      S.clockRunning = true;
      S.lastResumeTs = Date.now();
      AppState.screen = 'quiz';
      closeModal();
      LeaderboardEngine.stopLiveSync();
      renderShell();
      startQuizTimerLoop();
      showToast('▶️ Đã khôi phục bài đang làm ở Câu ' + (S.curIdx + 1) + '/' + S.items.length, 'ok');
    }

    function finishAndSubmitQuiz() {
      if (!S || S.finished) return;
      cancelAutoNext();
      qTimeFlush();
      flushSessionElapsed(true);
      stopQuizTimerLoop();
      S.finished = true;

      var earnedPts = 0;
      var maxPts = 0;
      var fullCorrectCount = 0;
      var wrongUids = [];
      var normalizedAnswers = [];

      S.items.forEach(function (it) {
        it.checked = true;
        var ev = evaluateQuizItem(it);
        if (!S.firstPts) S.firstPts = {};

        // Nếu câu chưa từng chấm trong chế độ Luyện tập (ví dụ chế độ Phòng thi hoặc câu bỏ qua), ghi thống kê
        if (S.first[it.uid] === undefined) {
          S.first[it.uid] = ev.isFullCorrect;
          S.firstPts[it.uid] = ev.pts;
          StorageEngine.recordQuestionOutcome(it.uid, !ev.isFullCorrect);
        }

        // Luyện tập: điểm chỉ tính theo LẦN CHỌN ĐẦU TIÊN — chọn sai rồi sửa lại đúng vẫn không được cộng điểm
        var countedPts = ev.pts;
        var countedCorrect = ev.isFullCorrect;
        if (S.mode === 'practice') {
          if (typeof S.firstPts[it.uid] === 'number') {
            countedPts = S.firstPts[it.uid];
          } else if (S.first[it.uid] === false && it.type !== 'truefalse') {
            countedPts = 0; // phiên cũ lưu trước bản vá: câu 1 đáp án mà lần đầu sai thì 0 điểm
          }
          countedCorrect = S.first[it.uid] === true && ev.isFullCorrect;
        }
        earnedPts += countedPts;
        maxPts += ev.maxPts;
        if (countedCorrect) {
          fullCorrectCount += 1;
        } else {
          wrongUids.push(it.uid);
        }

        normalizedAnswers.push({
          qId: it.uid,
          type: it.type,
          optOrder: it.optOrder || null,
          stOrder: it.stOrder || null,
          picked: it.type === 'single' ? it.picked : (it.type === 'truefalse' ? it.picks.slice() : it.inputText),
          isCorrect: ev.isFullCorrect,
          firstWrong: S.first[it.uid] === false,
          tries: Array.isArray(it.tries) ? deepClone(it.tries) : [],
          pts: Number(countedPts.toFixed(2)),
          finalPts: Number(ev.pts.toFixed(2)),
          qMs: Math.round(it.qMs || 0)
        });
      });

      var score10 = maxPts > 0 ? Number(((earnedPts / maxPts) * 10).toFixed(2)) : 0;
      var nowTs = Date.now();
      var playerName = (RAM.settings.playerName || S.playerName || '').trim() || 'Học viên ẩn danh';

      var attemptRecord = {
        id: 'att_' + nowTs + '_' + Math.random().toString(36).slice(2, 6),
        timestamp: nowTs,
        playerName: playerName,
        noRank: Boolean(S.noRank),
        mode: S.mode,
        lessonLabel: S.label,
        score: Number(earnedPts.toFixed(2)),
        maxScore: Number(maxPts.toFixed(2)),
        score10: score10,
        correctCount: fullCorrectCount,
        totalCount: S.items.length,
        durationMs: S.elapsedMs,
        wrongUids: wrongUids,
        answers: normalizedAnswers
      };

      StorageEngine.addHistoryAttempt(attemptRecord);
      StorageEngine.saveActiveSession(null);

      if (!attemptRecord.noRank) LeaderboardEngine.submitScore({
        playerName: playerName,
        score10: score10,
        rawScore: Number(earnedPts.toFixed(2)),
        maxScore: Number(maxPts.toFixed(2)),
        durationMs: S.elapsedMs,
        lessonLabel: S.label,
        mode: S.mode,
        timestamp: nowTs
      }).then(function (r) {
        if (r && r.key) { attemptRecord.fbKey = r.key; StorageEngine.putHistory(attemptRecord); }
      });

      if (attemptRecord.noRank) showToast('🔁 Lượt làm lại câu sai không tính vào Bảng xếp hạng', '', 3200);
      AppState.lastResult = attemptRecord;
      S = null;
      AppState.screen = 'result';
      AudioSynth.victory();
      renderShell();
    }

    function getWrongStatsSorted() {
      var rows = [];
      Object.keys(RAM.stats).forEach(function (uid) {
        var st = RAM.stats[uid];
        var q = CATALOG_MAP[uid];
        if (st && q && st.wrongs > 0 && st.attempts > 0) {
          var rate = (st.wrongs / st.attempts) * 100;
          rows.push({
            uid: uid,
            q: q,
            attempts: st.attempts,
            wrongs: st.wrongs,
            rate: rate,
            lastWrongAt: st.lastWrongAt || 0
          });
        }
      });
      // Sắp xếp câu tỉ lệ sai cao nhất & sai nhiều lần nhất lên trên cùng
      rows.sort(function (a, b) {
        if (Math.abs(b.rate - a.rate) > 0.001) return b.rate - a.rate;
        if (b.wrongs !== a.wrongs) return b.wrongs - a.wrongs;
        return b.lastWrongAt - a.lastWrongAt;
      });
      return rows;
    }

    // ---------------- THANH TRƯỢT ĐÚNG/SAI: vị trí trước đó để viên kính trượt mượt qua mỗi lần render ----------------
    var TF_PREV = {};
    function tfPosOf(v) { return v === true ? { p: 0, o: 1 } : (v === false ? { p: 1, o: 1 } : { p: 0.5, o: 0 }); }
    function tfSliderHtml(uid, sIdx, v, locked, label) {
      var key = (S ? S.sessionId : '') + ':' + uid + ':' + sIdx;
      var cur = tfPosOf(v), prev = TF_PREV[key], anim = '';
      if (prev && (Math.abs(prev.p - cur.p) > 0.001 || prev.o !== cur.o)) {
        anim = ' data-anim="1" style="--p:' + prev.p.toFixed(3) + ';--o:' + prev.o + ';"';
      }
      TF_PREV[key] = cur;
      var dv = v === true ? 't' : (v === false ? 'f' : 'n');
      return (
        '<div class="tf-sl' + (locked ? ' locked' : '') + '" data-sidx="' + sIdx + '" data-key="' + escapeHtml(key) + '" data-v="' + dv + '"' + anim +
          ' role="radiogroup" aria-label="Ý ' + escapeHtml(label) + ' — Đúng hay Sai" tabindex="' + (locked ? '-1' : '0') + '">' +
          '<div class="tf-sl-b">' +
            '<span class="tf-sl-c t" role="radio" aria-checked="' + (v === true) + '">Đúng</span>' +
            '<span class="tf-sl-c f" role="radio" aria-checked="' + (v === false) + '">Sai</span>' +
          '</div>' +
          '<div class="tf-sl-thumb" aria-hidden="true"><i class="tf-sl-tint"></i><i class="tf-sl-spec"></i><div class="tf-sl-in"><span class="tf-sl-c t">Đúng</span><span class="tf-sl-c f">Sai</span></div></div>' +
        '</div>'
      );
    }


    // ---------------- CẬP NHẬT DOM TẠI CHỖ (không dựng lại toàn bộ -> không chớp màn hình) ----------------
    function syncAttrs(f, t) {
      var fa = f.attributes, i;
      for (i = fa.length - 1; i >= 0; i--) {
        if (!t.hasAttribute(fa[i].name)) f.removeAttribute(fa[i].name);
      }
      var ta = t.attributes;
      for (i = 0; i < ta.length; i++) {
        if (f.getAttribute(ta[i].name) !== ta[i].value) f.setAttribute(ta[i].name, ta[i].value);
      }
    }
    function morphNode(f, t) {
      if (f.nodeType === 3 || f.nodeType === 8) {
        if (f.nodeValue !== t.nodeValue) f.nodeValue = t.nodeValue;
        return;
      }
      syncAttrs(f, t);
      var tag = f.nodeName;
      if (tag === 'INPUT') {
        if (document.activeElement !== f && f.value !== t.value) f.value = t.value;
        return;
      }
      if (tag === 'TEXTAREA') {
        if (document.activeElement !== f && f.value !== t.value) f.value = t.value;
        return;
      }
      // Khối có công thức KaTeX: chỉ vẽ lại khi nội dung gốc thật sự đổi
      if (f.__raw !== undefined) {
        if (t.innerHTML !== f.__raw) { f.innerHTML = t.innerHTML; f.__raw = t.innerHTML; }
        return;
      }
      morphChildren(f, t);
    }
    function morphChildren(f, t) {
      var tc = t.childNodes, i;
      for (i = 0; i < tc.length; i++) {
        var fn = f.childNodes[i], tn = tc[i];
        if (!fn) { f.appendChild(tn.cloneNode(true)); continue; }
        if (fn.nodeType !== tn.nodeType || fn.nodeName !== tn.nodeName) { f.replaceChild(tn.cloneNode(true), fn); continue; }
        morphNode(fn, tn);
      }
      while (f.childNodes.length > tc.length) f.removeChild(f.lastChild);
    }
    function morphInto(container, html) {
      if (!container.firstChild) { container.innerHTML = html; return; }
      var tpl = document.createElement('template');
      tpl.innerHTML = html;
      morphChildren(container, tpl.content);
    }
    function tagRawMath(root) {
      var els = root.querySelectorAll('.q-text, .opt-txt, .tf-txt, .explain-box');
      for (var i = 0; i < els.length; i++) { if (els[i].__raw === undefined) els[i].__raw = els[i].innerHTML; }
    }
    function syncQuizBars() {
      var tb = document.getElementById('quiz-bar-top'), bb = document.getElementById('quiz-bar-bottom');
      var root = document.documentElement;
      if (tb) root.style.setProperty('--qtop-h', tb.offsetHeight + 'px');
      if (bb) root.style.setProperty('--qbot-h', bb.offsetHeight + 'px');
    }
    function clearQuizBars() {
      document.documentElement.classList.remove('in-quiz');
      AppState.qvPatchKey = null;
      var tb = document.getElementById('quiz-bar-top'), bb = document.getElementById('quiz-bar-bottom');

      if (bb) bb.innerHTML = '';
    }

    // ---------------- MÀN HÌNH LÀM BÀI TRẮC NGHIỆM (QUIZ VIEW) ----------------

      var app = document.getElementById('app');
      if (!app || !S) return;
      qTimeFlush();
      applyFocus();

      var total = S.items.length;
      var idx = Math.max(0, Math.min(total - 1, S.curIdx));
      S.curIdx = idx;
      var item = S.items[idx];
      var q = CATALOG_MAP[item.uid];
      if (!q) return;

      var isPractice = S.mode === 'practice';
      var oneHand = Boolean(RAM.settings.oneHand);
      var bm = RAM.bookmarks[q.uid] || '';
      var pct = total > 0 ? (((idx + 1) / total) * 100).toFixed(1) : 0;

      // Trượt ngang 18px + fade-in khi đổi câu (hướng theo chiều đi tới/lùi); Streak Aura khi chuỗi đúng >= 3 / >= 5
      var slideCls = '';
      if (AppState.qvSession === S.sessionId && AppState.qvIdx >= 0 && AppState.qvIdx !== idx) slideCls = idx > AppState.qvIdx ? ' q-slide-r' : ' q-slide-l';
      AppState.qvSession = S.sessionId; AppState.qvIdx = idx;
      var aura = AppState.auraLevel || 0; AppState.auraLevel = 0;
      var auraCls = aura ? ' aura-' + aura : '';

      var timerInitText = '⏱️ 00:00';
      if (S.mode === 'exam') {
        var rem = Math.max(0, (S.examMinutes || 45) * 60 * 1000 - (S.elapsedMs || 0));
        timerInitText = '⏱️ ' + formatDuration(rem);
      } else {
        timerInitText = '⏱️ ' + formatDuration(S.elapsedMs || 0);
      }

      var timerUrgentCls = (S.mode === 'exam' && Math.max(0, (S.examMinutes || 45) * 60 * 1000 - (S.elapsedMs || 0)) <= 60000) ? ' urgent' : '';

      var bodyHtml = '';
      var letters = ['A', 'B', 'C', 'D'];

      // 1. Dạng Single Choice (4 lựa chọn)
      if (item.type === 'single') {
        bodyHtml = '<div class="opt-list">' + item.optOrder.map(function (origOptIdx, dispIdx) {
          var rawText = q.options[origOptIdx] || '';
          var cleanText = rawText.replace(/^[A-Da-d][\.\)\:]\s+/, '');
          var cls = 'opt';
          if (item.eliminated && item.eliminated.indexOf(dispIdx) !== -1) cls += ' elim';

          if (isPractice && item.checked) {
            if (dispIdx === item.correctIdx) cls += ' ok';
            else if (item.picked === dispIdx) cls += ' bad';
          } else {
            if (item.picked === dispIdx) cls += ' sel';
            else if (item.triedWrong && item.triedWrong.indexOf(dispIdx) !== -1) cls += ' tried-bad';
          }

          return (
            '<div class="' + cls + '" data-act="pick-single" data-idx="' + dispIdx + '">' +
              '<div class="opt-key">' + letters[dispIdx] + '</div>' +
              '<div class="opt-txt">' + escapeHtml(cleanText) + '</div>' +
              '<button type="button" class="opt-elim-btn" data-act="elim-opt" data-idx="' + dispIdx + '" title="Gạch loại trừ đáp án nhiễu (hoặc Chuột phải)">🚫</button>' +
            '</div>'
          );
        }).join('') + '</div>';
      }

      // 2. Dạng True / False (4 mệnh đề a, b, c, d)
      if (item.type === 'truefalse') {
        var tfLabels = ['a)', 'b)', 'c)', 'd)'];
        // Khóa thanh trượt sau khi chấm — riêng Chế độ 1 tay còn ý sai thì vẫn cho sửa
        var tfLocked = Boolean(isPractice && item.checked && !(oneHand && !evaluateQuizItem(item).isFullCorrect));
        bodyHtml = '<div class="tf-list">' + item.stOrder.map(function (origStIdx, dispIdx) {
          var stObj = q.statements[origStIdx] || { text: '', correct: false };
          var userPick = item.picks[dispIdx];
          var rowCls = 'tf-row';
          var statusNote = '';

          if (isPractice && item.checked) {
            var isRight = Boolean(userPick) === Boolean(stObj.correct);
            rowCls += isRight ? ' ok' : ' bad';
            statusNote =
              '<div style="font-size:12px;margin-top:4px;font-weight:700;color:' + (isRight ? '#6ee7b7' : '#fda4af') + ';">' +
                (isRight ? '✔ Chính xác' : '✖ Sai — Đáp án chuẩn: ' + (stObj.correct ? 'Đúng' : 'Sai')) +
              '</div>';
          }

          return (
            '<div class="' + rowCls + '">' +
              '<div class="tf-txt">' +
                '<span class="tf-lbl">' + tfLabels[dispIdx] + '</span>' +
                escapeHtml(stObj.text) +
                statusNote +
              '</div>' +
              tfSliderHtml(item.uid, dispIdx, userPick, tfLocked, tfLabels[dispIdx]) +
            '</div>'
          );
        }).join('') + '</div>';

        if (isPractice && item.checked) {
          var evTf = evaluateQuizItem(item);
          var tfCountedPts = (S.firstPts && typeof S.firstPts[item.uid] === 'number') ? S.firstPts[item.uid] : evTf.pts;
          bodyHtml +=
            '<div style="margin-top:10px;text-align:right;font-size:13px;font-weight:700;color:#fde68a;">' +
              '🎯 Đúng ' + evTf.rightCnt + '/4 ý — Điểm tính cho câu này: +' + tfCountedPts + ' / 1.0 điểm' +
              (tfCountedPts !== evTf.pts ? '<div style="font-weight:600;font-size:12px;opacity:.85;">(Điểm chỉ tính theo lần chọn đầu tiên — lần sửa lại không cộng thêm)</div>' : '') +
            '</div>';
        }
      }

      // 3. Dạng Short Answer (Trả lời ngắn + Numpad 1 tay)
      if (item.type === 'short') {
        var inpCls = 'glass-input short-input';
        var shortFeedback = '';
        if (isPractice && item.checked) {
          var sOk = isShortEqual(item.inputText, q.correct);
          inpCls += sOk ? ' ok' : ' bad';
          shortFeedback =
            '<div style="margin-top:9px;font-size:14px;font-weight:700;color:' + (sOk ? '#6ee7b7' : '#fda4af') + ';">' +
              (sOk ? '✔ Chính xác tuyệt đối!' : '✖ Chưa đúng — Đáp án chuẩn: ' + escapeHtml(q.correct)) +
            '</div>';
        }

        var numpadHtml = '';
        if (oneHand && (!isPractice || !item.checked)) {
          var keys = ['7', '8', '9', '-', '4', '5', '6', ',', '1', '2', '3', '⌫', '0', 'C', 'OK'];
          numpadHtml =
            '<div class="numpad-grid">' +
              keys.map(function (k) {
                var extra = k === 'OK' ? ' np-ok' : '';
                return '<button type="button" class="numpad-btn' + extra + '" data-act="numpad" data-k="' + k + '">' + (k === 'OK' ? '✔ Kiểm tra' : k) + '</button>';
              }).join('') +
            '</div>';
        }

        bodyHtml =
          '<div class="short-wrap">' +
            '<input type="text" id="short-ans-input" class="' + inpCls + '" inputmode="decimal" autocomplete="off" placeholder="Nhập đáp án số..." value="' + escapeHtml(item.inputText || '') + '"' +
              ((isPractice && item.checked) ? ' readonly' : '') + ' />' +
            shortFeedback +
            numpadHtml +
          '</div>';
      }

      // Khung Giải thích & Ghi chú cá nhân (Hiện sau khi Kiểm tra ở chế độ Luyện tập)
      var postCheckHtml = '';
      if (isPractice && item.checked) {
        var savedNote = RAM.notes[q.uid] || '';
        postCheckHtml =
          (q.explanation
            ? '<div class="explain-box"><strong>💡 Giải thích chi tiết:</strong><div style="margin-top:4px;">' + escapeHtml(q.explanation) + '</div></div>'
            : '') +
          '<div class="note-box">' +
            '<label for="personal-note-inp">📝 Ghi chú / Mẹo nhớ của riêng bạn (Tự động lưu IndexedDB):</label>' +
            '<textarea id="personal-note-inp" class="note-textarea" data-uid="' + escapeHtml(q.uid) + '" placeholder="Ghi lại công thức hoặc bẫy hay nhầm của câu này...">' + escapeHtml(savedNote) + '</textarea>' +
          '</div>';
      }

      // Nút hành động chính phía dưới
      var mainActionHtml = '';
      if (isPractice) {
        if (!item.checked) {
          var canCheck = isItemAnswered(item);
          mainActionHtml =
            '<button type="button" class="btn-capsule" data-act="check-answer"' + (canCheck ? '' : ' disabled') + '>' +
              '✨ Kiểm tra đáp án' +
            '</button>';
        } else {
          var evCur = evaluateQuizItem(item);
          var isLast = idx >= total - 1;
          mainActionHtml =
            '<div style="display:flex;gap:9px;width:100%;">' +
              (!evCur.isFullCorrect
                ? '<button type="button" class="btn-pill" style="flex-shrink:0;padding:0 18px;" data-act="retry-current">🔄 Thử lại</button>'
                : '') +
              '<button type="button" class="btn-capsule" data-act="next-or-finish">' +
                (isLast ? '🏁 Hoàn thành & Xem điểm' : 'Câu tiếp theo ▶') +
              '</button>' +
            '</div>';
        }
      } else {
        // Chế độ Phòng thi
        var isLastExam = idx >= total - 1;
        mainActionHtml =
          '<div style="display:flex;gap:9px;width:100%;">' +
            '<button type="button" class="btn-pill" style="flex-shrink:0;padding:0 16px;" data-act="open-palette">📋 Bảng câu</button>' +
            '<button type="button" class="btn-capsule" data-act="' + (isLastExam ? 'submit-exam' : 'next-q') + '">' +
              (isLastExam ? '📤 Nộp bài & Chấm điểm' : 'Câu tiếp theo ▶') +
            '</button>' +
          '</div>';
      }

      // Thanh chức năng (trên) và thanh Câu trước/Câu sau (dưới) nằm ngoài vùng cuộn: cố định, không bị dựng lại khi chọn đáp án
      var topBarHtml =
          '<div class="quiz-top-bar">' +
            '<div style="display:flex;align-items:center;gap:7px;">' +
              '<button type="button" class="btn-pill pill-sm" data-act="pause-to-home" title="Lưu tạm và về Trang chủ">🏠 Lưu tạm</button>' +
              '<span style="font-weight:800;font-size:13.5px;color:#f8fafc;">Câu ' + (idx + 1) + '/' + total + '</span>' +
              '<span class="timer-badge' + timerUrgentCls + '" id="quiz-live-timer">' + timerInitText + '</span>' +
            '</div>' +
            '<div style="display:flex;align-items:center;gap:6px;flex-wrap:wrap;">' +
              '<span class="fs-group">' +
                '<button type="button" class="btn-pill pill-sm" data-act="font-dec" title="Giảm cỡ chữ">A−</button>' +
                '<button type="button" class="btn-pill pill-sm" data-act="font-inc" title="Tăng cỡ chữ">A+</button>' +
              '</span>' +
              '<button type="button" class="btn-pill pill-sm' + (RAM.settings.focus ? ' on' : '') + '" data-act="quick-toggle-focus" title="Chế độ Tập trung">🎯 ' + (RAM.settings.focus ? 'Tập trung' : 'Tập trung') + '</button>' +
              '<button type="button" class="btn-pill pill-sm" data-focus-hide data-act="quick-toggle-theme" title="Đổi giao diện Sáng / Tối">' + (resolveTheme() === 'light' ? '🌙' : '☀️') + '</button>' +
              '<button type="button" class="btn-pill pill-sm' + (oneHand ? ' on' : '') + '" data-focus-hide data-act="quick-toggle-onehand">🤚 1 Tay: ' + (oneHand ? 'BẬT' : 'TẮT') + '</button>' +
              '<button type="button" class="btn-pill pill-sm' + (RAM.settings.sound ? ' on' : '') + '" data-focus-hide data-act="quick-toggle-sound" title="Bật/Tắt âm thanh">' + (RAM.settings.sound ? '🔊' : '🔇') + '</button>' +
              '<button type="button" class="btn-pill pill-sm' + (RAM.settings.lite ? ' on' : '') + '" data-focus-hide data-act="quick-toggle-lite" title="Chế độ siêu tối giản cho máy yếu">🪶 Lite</button>' +
              '<button type="button" class="btn-pill pill-sm" data-act="toggle-scratch">✏️ Nháp</button>' +
              (S.mode === 'exam' ? '<button type="button" class="btn-pill pill-sm on" data-act="submit-exam">📤 Nộp bài</button>' : '') +
            '</div>' +
            '<div class="quiz-progress-track">' +
              '<div class="quiz-progress-fill' + (aura ? ' aura-fx aura-' + aura : '') + '" style="width:' + pct + '%;"></div>' +
            '</div>' +
          '</div>';

      var footerHtml =
            '<div class="quiz-footer-nav">' +
              '<button type="button" class="btn-pill pill-sm" data-act="prev-q"' + (idx === 0 ? ' disabled' : '') + '>◀ Câu trước</button>' +
              '<span style="font-size:12px;color:var(--txt-sub);">🔥 Chuỗi đúng: <strong style="color:#ffae2b;">' + AudioSynth.getStreak() + '</strong></span>' +
              '<button type="button" class="btn-pill pill-sm" data-act="next-q"' + (idx >= total - 1 ? ' disabled' : '') + '>Câu sau ▶</button>' +
            '</div>';

      var stageHtml =
        '<div class="quiz-stage' + (oneHand ? ' thumb-zone' : '') + '" id="quiz-swipe-zone">' +
          '<article class="card' + slideCls + auraCls + '">' +
            '<div class="q-meta-row">' +
              '<span class="q-sec-tag">' + escapeHtml(q.section) + '</span>' +
              '<div class="pill-row">' +
                '<button type="button" class="btn-pill pill-sm' + (bm === 'star' ? ' on' : '') + '" data-act="bookmark" data-bm="star">⭐ Câu hay</button>' +
                '<button type="button" class="btn-pill pill-sm pill-warn' + (bm === 'warn' ? ' on' : '') + '" data-act="bookmark" data-bm="warn">⚠️ Phân vân</button>' +
              '</div>' +
            '</div>' +

            '<h2 class="q-text">' + escapeHtml(q.question) + '</h2>' +

            (q.image
              ? '<div class="q-img-wrap"><img src="' + escapeHtml(q.image) + '" alt="Hình minh họa câu hỏi" data-act="zoom-img" /></div>'
              : '') +

            bodyHtml +
            postCheckHtml +

            '<div style="margin-top:16px;">' + mainActionHtml + '</div>' +

          '</article>' +

          '<div class="kbd-hint">⌨️ Phím tắt: [1-4 / A-D] Chọn đáp án • [Enter / Space] Kiểm tra & Qua câu • [◀ / ▶] Chuyển câu • Chuột phải gạch nhiễu</div>' +
        '</div>';

      var barTopEl = document.getElementById('quiz-bar-top');
      var barBotEl = document.getElementById('quiz-bar-bottom');
      document.documentElement.classList.add('in-quiz');
      // Cùng một câu (chọn đáp án, bật/tắt chế độ...) -> chỉ cập nhật phần thay đổi, KHÔNG dựng lại cả màn hình (hết chớp đen)
      var patchKey = S.sessionId + '#' + idx;
      var sameQuestion = AppState.qvPatchKey === patchKey && app.firstElementChild && app.firstElementChild.id === 'quiz-swipe-zone';
      AppState.qvPatchKey = patchKey;
      if (sameQuestion) { morphInto(app, stageHtml); } else { app.innerHTML = stageHtml; }
      if (barTopEl) morphInto(barTopEl, topBarHtml);
      if (barBotEl) morphInto(barBotEl, footerHtml);
      tagRawMath(app);
      syncQuizBars();

      renderMathInContainer(app);

      // Thanh trượt Đúng/Sai: sau 2 khung hình mới gỡ vị trí cũ để CSS trượt viên kính tới vị trí mới
      var tfAnimEls = app.querySelectorAll('.tf-sl[data-anim]');
      if (tfAnimEls.length) {
        requestAnimationFrame(function () {
          requestAnimationFrame(function () {
            tfAnimEls.forEach(function (el) {
              el.removeAttribute('data-anim');
              el.style.removeProperty('--p');
              el.style.removeProperty('--o');
              el.classList.add('go'); // giọt kính vươn dài khi lướt rồi co lại
              el.addEventListener('animationend', function () { el.classList.remove('go'); }, { once: true });
            });
          });
        });
      }
      // Khúc xạ rìa kính (Chrome): dựng bản đồ đúng kích thước viên kính, lgEnsureFilter tự cache
      var tfThumbEl = app.querySelector('.tf-sl-thumb');
      if (tfThumbEl && document.documentElement.classList.contains('lg-refract')) {
        try {
          var tfTh = tfThumbEl.offsetHeight, tfTw = tfThumbEl.offsetWidth;
          if (tfTh > 0 && tfTw > 0) {
            lgEnsureFilter('lgf-tfthumb', tfTw, tfTh, 0, tfTh / 2, Math.min(16, tfTh * 0.34), 20);
            document.documentElement.classList.add('tf-rf');
          }
        } catch (_) {}
      }
      if (AppState.tfFocus != null) {
        var tfFocusEl = app.querySelector('.tf-sl[data-sidx="' + AppState.tfFocus + '"]');
        AppState.tfFocus = null;
        if (tfFocusEl) { try { tfFocusEl.focus({ preventScroll: true }); } catch (_) {} }
      }

      // Tự động focus vào ô nhập số nếu ở dạng Trả lời ngắn và không bật Numpad cảm ứng di động
      if (item.type === 'short' && (!isPractice || !item.checked)) {
        var inp = document.getElementById('short-ans-input');
        if (inp && (!oneHand || window.innerWidth > 768)) {
          setTimeout(function () {
            try { inp.focus(); inp.setSelectionRange(inp.value.length, inp.value.length); } catch (_) {}
          }, 25);
        }
      }
    }

    // ---------------- MÀN HÌNH KẾT QUẢ VỪA LÀM XONG ----------------

    // ---------------- THỐNG KÊ THỜI GIAN TỪNG CÂU ----------------
    function fmtSec(ms) {
      var t = Math.round((ms || 0) / 1000), m = Math.floor(t / 60), r = t % 60;
      return m + ':' + (r < 10 ? '0' : '') + r;
    }
    function timeStatsOf(rec) {
      var ans = (rec && rec.answers) || [];
      var timed = ans.filter(function (a) { return typeof a.qMs === 'number' && a.qMs > 0; });
      if (timed.length === 0) return null;
      var total = 0, longest = null, slowCorrect = 0, byType = {};
      timed.forEach(function (a) {
        total += a.qMs;
        if (!longest || a.qMs > longest.qMs) longest = a;
        if (a.isCorrect && a.qMs > SLOW_CORRECT_MS) slowCorrect += 1;
        var b = byType[a.type] || (byType[a.type] = { n: 0, ms: 0, slow: 0 });
        b.n += 1; b.ms += a.qMs; if (a.isCorrect && a.qMs > SLOW_CORRECT_MS) b.slow += 1;
      });
      return { avg: total / timed.length, longest: longest, slowCorrect: slowCorrect, byType: byType, n: timed.length };
    }
    function timeSummaryLine(rec) {
      var st = timeStatsOf(rec);
      if (!st) return '';
      return '<p style="margin:-4px 0 12px;font-size:12.5px;color:var(--txt-sub);">⏱️ Trung bình <strong style="color:#fde68a;">' + fmtSec(st.avg) + '</strong>/câu' +
        (st.slowCorrect > 0 ? ' • 🐢 <strong style="color:#fda4af;">' + st.slowCorrect + '</strong> câu đúng nhưng chậm (&gt; 90 giây)' : '') + '</p>';
    }
    function timeStatsCardHtml(rec) {
      var st = timeStatsOf(rec);
      if (!st) return '';
      var names = { single: '🅰️ Nhiều lựa chọn', truefalse: '⚖️ Đúng / Sai', short: '🔢 Trả lời ngắn' };
      var keys = Object.keys(st.byType), worstKey = '', worstAvg = 0;
      keys.forEach(function (k) { var a = st.byType[k].ms / st.byType[k].n; if (a > worstAvg) { worstAvg = a; worstKey = k; } });
      var rows = keys.map(function (k) {
        var b = st.byType[k], a = b.ms / b.n;
        var warn = (keys.length > 1 && k === worstKey && a > 45000) || b.slow > 0;
        return '<div class="time-row' + (keys.length > 1 && k === worstKey && a > 45000 ? ' worst' : '') + '">' +
          '<span>' + (names[k] || k) + ' <span style="color:var(--txt-sub);">(' + b.n + ' câu)</span></span>' +
          '<span><b>' + fmtSec(a) + '</b>/câu' + (b.slow > 0 ? ' • 🐢 ' + b.slow + ' chậm' : '') + (warn && k === worstKey && keys.length > 1 && a > 45000 ? ' ⚠️ chậm nhất' : '') + '</span></div>';
      }).join('');
      return '<section class="card">' +
        '<div class="card-hd"><div><div class="card-title">⏱️ Thống kê thời gian từng câu</div>' +
        '<span class="card-sub">Trung bình ' + fmtSec(st.avg) + '/câu • lâu nhất ' + fmtSec(st.longest.qMs) + '</span></div></div>' +
        rows +
        (st.slowCorrect > 0
          ? '<div style="margin-top:10px;font-size:12.5px;color:var(--txt-sub);">🐢 Có <b style="color:#fda4af;">' + st.slowCorrect + '</b> câu bạn làm đúng nhưng mất hơn 90 giây — nên luyện thêm tốc độ ở dạng bài này.</div>'
          : '') +
        '</section>';
    }

    function renderReviewView(rec) {

    function renderReviewItemsOnly() {
      var box = document.getElementById('review-items-box');
      var rec = AppState.reviewRecord;
      if (!box || !rec) return;

      var filtered = rec.answers.filter(function (ans) {
        if (AppState.revFilter === 'wrong') return !ans.isCorrect || ans.firstWrong;
        if (AppState.revFilter === 'right') return ans.isCorrect && !ans.firstWrong;
        return true;
      });

      if (filtered.length === 0) {
        box.innerHTML = '<div class="card" style="text-align:center;color:var(--txt-sub);">Không có câu hỏi nào trong bộ lọc này.</div>';
        return;
      }

      var letters = ['A', 'B', 'C', 'D'];
      var tfLabels = ['a)', 'b)', 'c)', 'd)'];

      box.innerHTML = filtered.map(function (ans, idx) {
        var q = CATALOG_MAP[ans.qId];
        if (!q) {
          return '<div class="card"><div class="card-sub">Câu hỏi ID #' + escapeHtml(ans.qId) + ' không còn trong đề hiện tại.</div></div>';
        }

        var detailHtml = '';
        var triesArr = Array.isArray(ans.tries) ? ans.tries : [];
        var trailHtml = '';
        if (ans.type === 'single') {
          var order = Array.isArray(ans.optOrder) && ans.optOrder.length === q.options.length
            ? ans.optOrder
            : q.options.map(function (_, i) { return i; });

          // Vị trí hiển thị của đáp án đúng và đáp án người học chốt cuối cùng
          var correctDisp = -1;
          order.forEach(function (origIdx, dIdx) { if (origIdx === q.correct) correctDisp = dIdx; });
          var finalPick = (ans.picked === null || ans.picked === undefined) ? -1 : ans.picked;
          var gotRight = finalPick === correctDisp;
          var wrongSeq = triesArr.filter(function (t) { return typeof t === 'number' && t !== correctDisp; });
          // Câu cũ (chưa lưu lịch sử) hoặc phòng thi: đáp án chốt sai vẫn được tính là một lần chọn sai
          if (finalPick >= 0 && !gotRight && wrongSeq.indexOf(finalPick) === -1) wrongSeq.push(finalPick);

          detailHtml = '<div class="opt-list">' + order.map(function (origIdx, dIdx) {
            var isRightOpt = origIdx === q.correct;
            var wrongNo = wrongSeq.indexOf(dIdx) + 1; // 0 = chưa từng chọn sai ở đáp án này
            var cls = 'opt' + (isRightOpt ? ' ok' : (wrongNo > 0 ? ' bad' : ''));
            var badge = '';
            if (isRightOpt) {
              badge = gotRight
                ? '<span class="xyz-badge rv-ok">' + (wrongSeq.length > 0 ? 'Chọn đúng ở lần ' + (wrongSeq.length + 1) + ' ✔' : 'Bạn chọn ✔') + '</span>'
                : '<span class="xyz-badge rv-ok">Đáp án đúng ✔</span>';
            } else if (wrongNo > 0) {
              badge = '<span class="xyz-badge rv-bad">' + (wrongSeq.length > 1 ? 'Chọn sai lần ' + wrongNo + ' ✖' : 'Bạn chọn ✖') + '</span>';
            }
            return (
              '<div class="' + cls + '" style="cursor:default;">' +
                '<div class="opt-key">' + letters[dIdx] + '</div>' +
                '<div class="opt-txt">' + escapeHtml(q.options[origIdx] || '') + '</div>' +
                badge +
              '</div>'
            );
          }).join('') + '</div>';

          if (wrongSeq.length > 0) {
            trailHtml = '<div class="rv-trail">🔁 Hành trình chọn: ' +
              wrongSeq.map(function (dIdx) { return '<span class="rv-chip bad">' + letters[dIdx] + ' ✖</span>'; }).join('<span class="rv-arrow">→</span>') +
              '<span class="rv-arrow">→</span>' +
              (gotRight
                ? '<span class="rv-chip ok">' + letters[correctDisp] + ' ✔</span>'
                : '<span class="rv-chip ok">Đáp án đúng: ' + (correctDisp >= 0 ? letters[correctDisp] : '?') + '</span> <span style="opacity:.8;">(chưa thử lại)</span>') +
              '</div>';
          }
        } else if (ans.type === 'truefalse') {
          var stOrd = Array.isArray(ans.stOrder) && ans.stOrder.length === 4 ? ans.stOrder : [0, 1, 2, 3];
          var picks = Array.isArray(ans.picked) ? ans.picked : [null, null, null, null];
          var tfTries = triesArr.filter(function (t) { return Array.isArray(t); });
          var lastTry = tfTries[tfTries.length - 1];
          var finalIsLastTry = lastTry && JSON.stringify(lastTry) === JSON.stringify(picks);
          var tfChip = function (v, correctVal) {
            var good = Boolean(v) === Boolean(correctVal);
            return '<span class="rv-chip ' + (good ? 'ok' : 'bad') + '">' + (v ? 'Đúng' : 'Sai') + (good ? ' ✔' : ' ✖') + '</span>';
          };
          detailHtml = '<div class="tf-list">' + stOrd.map(function (origIdx, dIdx) {
            var st = q.statements[origIdx] || { text: '', correct: false };
            var uVal = picks[dIdx];
            var ok = uVal !== null && uVal !== undefined && Boolean(uVal) === Boolean(st.correct);
            // Chuỗi các lần chọn của ý này: các lần sai trước đó -> lần chốt cuối
            var chain = tfTries.map(function (t) { return t[dIdx]; });
            if (!finalIsLastTry) chain.push(uVal);
            chain = chain.filter(function (v) { return v === true || v === false; });
            chain = chain.filter(function (v, i) { return i === 0 || v !== chain[i - 1]; });
            var chosenHtml = chain.length
              ? chain.map(function (v) { return tfChip(v, st.correct); }).join('<span class="rv-arrow">→</span>')
              : '<span style="color:#fde68a;">Bỏ trống</span>';
            return (
              '<div class="tf-row ' + (ok ? 'ok' : 'bad') + '">' +
                '<div class="tf-txt"><span class="tf-lbl">' + tfLabels[dIdx] + '</span>' + escapeHtml(st.text) + '</div>' +
                '<div style="font-size:12px;font-weight:700;">' +
                  'Bạn chọn: ' + chosenHtml + ' • ' +
                  'Chuẩn: <span style="color:#6ee7b7;">' + (st.correct ? 'Đúng' : 'Sai') + '</span>' +
                '</div>' +
              '</div>'
            );
          }).join('') + '</div>';
        } else {
          var shSeq = triesArr.filter(function (t) { return typeof t === 'string' && t; });
          var shFinal = String(ans.picked || '').trim();
          if (shFinal && shSeq[shSeq.length - 1] !== shFinal) shSeq.push(shFinal);
          var shChips = shSeq.map(function (v) {
            var good = isShortEqual(v, q.correct);
            return '<span class="rv-chip ' + (good ? 'ok' : 'bad') + '">' + escapeHtml(v) + (good ? ' ✔' : ' ✖') + '</span>';
          }).join('<span class="rv-arrow">→</span>');
          detailHtml =
            '<div style="padding:10px 14px;border-radius:14px;background:rgba(255,255,255,0.05);">' +
              '<div>Bạn đã nhập: ' + (shChips || '<strong style="color:#fda4af;">(Bỏ trống)</strong>') + '</div>' +
              '<div style="margin-top:6px;">Đáp án chuẩn: <strong style="color:#fde68a;">' + escapeHtml(q.correct) + '</strong></div>' +
            '</div>';
        }

        var noteTxt = RAM.notes[q.uid] || '';

        var hasT = typeof ans.qMs === 'number' && ans.qMs > 0;
        var slowOk = hasT && ans.isCorrect && ans.qMs > SLOW_CORRECT_MS;
        var timeBadges =
          (hasT ? '<span class="time-badge">⏱️ ' + fmtSec(ans.qMs) + '</span>' : '') +
          (slowOk ? '<span class="slow-badge" title="Đúng nhưng mất hơn 90 giây">🐢 Đúng nhưng chậm</span>' : '');

        return (
          '<article class="card' + (slowOk ? ' slow-card' : '') + '">' +
            '<div class="q-meta-row">' +
              '<span class="q-sec-tag">Câu ' + (idx + 1) + ' • ' + escapeHtml(q.section) + '</span>' +
              '<div class="pill-row" style="justify-content:flex-end;">' + timeBadges + '<span class="xyz-badge">+' + ans.pts + ' điểm</span>' + ((typeof ans.finalPts === 'number' && ans.finalPts > ans.pts) ? '<span class="slow-badge" title="Chỉ tính điểm theo lần chọn đầu tiên">↻ Sửa lại — không cộng điểm</span>' : '') + '</div>' +
            '</div>' +
            '<h3 class="q-text" style="font-size:15.5px;">' + escapeHtml(q.question) + '</h3>' +
            (q.image ? '<div class="q-img-wrap"><img src="' + escapeHtml(q.image) + '" alt="" data-act="zoom-img" /></div>' : '') +
            trailHtml +
            detailHtml +
            (q.explanation ? '<div class="explain-box"><strong>💡 Giải thích:</strong> ' + escapeHtml(q.explanation) + '</div>' : '') +
            (noteTxt ? '<div class="note-box"><label>📝 Ghi chú của bạn:</label><div style="font-size:13.5px;color:#fde68a;">' + escapeHtml(noteTxt) + '</div></div>' : '') +
          '</article>'
        );
      }).join('');

      // [PERF] Trước đây dựng KaTeX cho TOÀN BỘ thẻ trong 1 khối đồng bộ (đứng hình khi mở bài dài / đổi bộ lọc).
      // Nay: các thẻ đầu (vùng nhìn thấy) dựng ngay, phần còn lại dựng nối tiếp lúc rảnh — kết quả cuối cùng giống hệt.
      var revCards = box.children, revFirst = Math.min(6, revCards.length);
      for (var rci = 0; rci < revFirst; rci++) renderMathInContainer(revCards[rci]);
      var revToken = (AppState.revMathToken = (AppState.revMathToken || 0) + 1), revNext = revFirst;
      if (revCards.length > revFirst) {
        (function revStep() {
          if (AppState.revMathToken !== revToken || !box.isConnected) return;
          var stop = Math.min(revCards.length, revNext + 4);
          for (; revNext < stop; revNext++) renderMathInContainer(revCards[revNext]);
          if (revNext < revCards.length) {
            if (window.requestIdleCallback) window.requestIdleCallback(revStep, { timeout: 150 });
            else setTimeout(revStep, 16);
          }
        })();
      }
    }

            '<div class="stat-tile"><div class="stat-val">' + best10.toFixed(2) + '</div><div class="stat-lbl">Điểm cao nhất</div></div>' +
            '<div class="stat-tile"><div class="stat-val">' + avg10 + '</div><div class="stat-lbl">Điểm trung bình</div></div>' +

    function renderLeaderboardTab(app) {

      ], AppState.lbFilter, 'lg-compact');

        : '';

      var lessonPills =
        '<div id="lb-lesson-pills" class="pill-row" style="margin-top:10px;' + (AppState.lbFilter === 'lesson' ? '' : 'display:none;') + '">' +

    function renderLeaderboardListOnly() {
      var box = document.getElementById('lb-rows-box');
      if (!box) return;

      var rawList = LeaderboardEngine.getEntries().slice().filter(function (e) {
        return e && !e.noRank && !/Làm lại \d+ câu sai/.test(String(e.lessonLabel || ''));
      });
      if (AppState.lbFilter === 'lesson' && AppState.lbLesson !== 'ALL') {
        rawList = rawList.filter(function (e) {
          return String(e.lessonLabel || '').indexOf(AppState.lbLesson) !== -1;
        });
      }

      if (AppState.lbFilter === 'latest') {
        rawList.sort(function (a, b) { return (b.timestamp || 0) - (a.timestamp || 0); });
      } else {
        // Mặc định Top cao nhất (cùng điểm ưu tiên người làm nhanh hơn)
        rawList.sort(function (a, b) {
          var ds = (Number(b.score10) || 0) - (Number(a.score10) || 0);
          if (Math.abs(ds) > 0.001) return ds;
          return (Number(a.durationMs) || 99999999) - (Number(b.durationMs) || 99999999);
        });
      }

      var myName = (RAM.settings.playerName || '').trim().toLowerCase();
      var topSlice = rawList.slice(0, 60);

      if (topSlice.length === 0) {
        box.__lbH = null;
        box.innerHTML = '<div style="text-align:center;padding:22px 10px;color:var(--txt-sub);">Chưa có dữ liệu xếp hạng. Hãy hoàn thành bài thi đầu tiên để ghi danh Top 1!</div>';
        return;
      }

      var lbHtml = topSlice.map(function (entry, idx) {
        var rankNum = idx + 1;
        var medalCls = rankNum === 1 ? ' rank-1' : (rankNum === 2 ? ' rank-2' : (rankNum === 3 ? ' rank-3' : ''));
        var medalTxt = rankNum === 1 ? '🥇' : (rankNum === 2 ? '🥈' : (rankNum === 3 ? '🥉' : String(rankNum)));
        var isMe = myName && String(entry.playerName || '').trim().toLowerCase() === myName;

        return (
          '<div class="lb-row' + (isMe ? ' me' : '') + '">' +
            '<div style="display:flex;align-items:center;gap:11px;min-width:0;">' +
              '<div class="rank-medal' + medalCls + '">' + medalTxt + '</div>' +
              '<div style="min-width:0;">' +
                '<div style="font-weight:700;color:#f8fafc;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">' +
                  escapeHtml(entry.playerName || 'Học viên') + (isMe ? ' <span style="color:#ffae2b;font-size:11.5px;">(Bạn)</span>' : '') +
                '</div>' +
                '<div style="font-size:11.5px;color:var(--txt-sub);">' +
                  escapeHtml(entry.lessonLabel || 'Tổng hợp') + ' • ' + formatDateTime(entry.timestamp) +
                '</div>' +
              '</div>' +
            '</div>' +
            '<div style="text-align:right;flex-shrink:0;">' +
              '<div style="font-family:var(--font-mono);font-size:16px;font-weight:800;color:#ffae2b;">' + Number(entry.score10 || 0).toFixed(2) + 'đ</div>' +
              '<div style="font-family:var(--font-mono);font-size:11.5px;color:var(--txt-sub);">⏱️ ' + formatDuration(entry.durationMs || 0) + '</div>' +
            '</div>' +
          '</div>'
        );
      }).join('');
      if (box.__lbH !== lbHtml) { box.__lbH = lbHtml; box.innerHTML = lbHtml; }
    }
