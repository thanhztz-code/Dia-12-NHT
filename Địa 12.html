    // ---------------- XỬ LÝ TƯƠNG TÁC TRẢ LỜI TRONG BÀI THI ----------------
    function triggerAutoAdvance(hasExplanation) {
      cancelAutoNext();
      if (!S || S.mode !== 'practice' || !RAM.settings.oneHand) return;
      var waitMs = hasExplanation ? 1200 : 450;
      AppState.autoNextTimer = setTimeout(function () {
        AppState.autoNextTimer = 0;
        if (!S || AppState.screen !== 'quiz') return;
        if (S.curIdx < S.items.length - 1) {
          S.curIdx += 1;
          persistCurrentSession(false);
          renderQuizView();
        } else {
          finishAndSubmitQuiz();
        }
      }, waitMs);
    }

    function vibrateDevice(pattern) {
      try {
        if (navigator.vibrate) navigator.vibrate(pattern);
      } catch (_) {}
    }

    function handlePickSingle(dispIdx) {
      if (!S) return;
      var item = S.items[S.curIdx];
      var q = CATALOG_MAP[item.uid];
      if (!item || !q) return;

      // Chế độ Phòng thi: chỉ lưu lựa chọn, chưa chấm
      if (S.mode === 'exam') {
        item.picked = dispIdx;
        AudioSynth.tap();
        persistCurrentSession(false);
        renderQuizView();
        return;
      }

      // Chế độ Luyện tập mặc định (2 bước)
      if (!RAM.settings.oneHand) {
        if (item.checked) return;
        item.picked = dispIdx;
        AudioSynth.tap();
        persistCurrentSession(false);
        renderQuizView();
        return;
      }

      // Chế độ 1 Tay thông minh: Chạm chấm điểm ngay lập tức!
      if (item.checked) {
        // Nếu đã đúng rồi mà người dùng chạm nhẹ lần nữa thì qua câu luôn
        cancelAutoNext();
        if (S.curIdx < S.items.length - 1) {
          S.curIdx += 1;
          persistCurrentSession(false);
          renderQuizView();
        } else {
          finishAndSubmitQuiz();
        }
        return;
      }

      item.picked = dispIdx;
      var isRight = dispIdx === item.correctIdx;
      recordFirstAttemptIfNeeded(item, isRight);

      if (isRight) {
        item.checked = true;
        AudioSynth.correct();
        vibrateDevice(25);
        showToast('Làm tốt lắm - Hãy giữ vững phong độ. Tiến lên', 'ok', 1350);
        persistCurrentSession(false);
        renderQuizView();
        triggerAutoAdvance(Boolean(q.explanation));
      } else {
        // Nếu SAI ở chế độ 1 tay: đánh dấu viền đỏ mờ phương án đó & cho chạm chọn lại đáp án khác ngay lập tức!
        if (!item.triedWrong) item.triedWrong = [];
        if (item.triedWrong.indexOf(dispIdx) === -1) item.triedWrong.push(dispIdx);
        item.picked = null;
        AudioSynth.wrong();
        vibrateDevice([40, 50, 40]);
        showToast('Không đúng! - Làm lại hoặc bạn có thể bỏ qua', 'bad', 1800);
        persistCurrentSession(false);
        renderQuizView();
      }
    }

    function handlePickTrueFalse(sIdx, boolVal) {
      if (!S) return;
      var item = S.items[S.curIdx];
      var q = CATALOG_MAP[item.uid];
      if (!item || !q) return;

      if (S.mode === 'exam') {
        item.picks[sIdx] = boolVal;
        AudioSynth.tap();
        persistCurrentSession(false);
        renderQuizView();
        return;
      }

      // Trong chế độ 1 tay: nếu đã chấm nhưng có ý sai, cho chạm sửa lại trực tiếp trên nút [Đúng]/[Sai]!
      if (item.checked && RAM.settings.oneHand) {
        var prevEv = evaluateQuizItem(item);
        if (!prevEv.isFullCorrect) {
          item.picks[sIdx] = boolVal;
          var nextEv = evaluateQuizItem(item);
          if (nextEv.isFullCorrect) {
            AudioSynth.correct();
            vibrateDevice(25);
            showToast('Làm tốt lắm - Đã sửa đúng cả 4 ý!', 'ok', 1350);
            persistCurrentSession(false);
            renderQuizView();
            triggerAutoAdvance(Boolean(q.explanation));
          } else {
            AudioSynth.tap();
            persistCurrentSession(false);
            renderQuizView();
          }
          return;
        }
      }

      if (item.checked) return;

      item.picks[sIdx] = boolVal;
      AudioSynth.tap();

      var allFourPicked = item.picks.every(function (p) { return p === true || p === false; });
      if (RAM.settings.oneHand && allFourPicked) {
        item.checked = true;
        var ev = evaluateQuizItem(item);
        recordFirstAttemptIfNeeded(item, ev.isFullCorrect);
        if (ev.isFullCorrect) {
          AudioSynth.correct();
          vibrateDevice(25);
          showToast('Làm tốt lắm - Hãy giữ vững phong độ. Tiến lên', 'ok', 1400);
          persistCurrentSession(false);
          renderQuizView();
          triggerAutoAdvance(Boolean(q.explanation));
        } else {
          AudioSynth.wrong();
          vibrateDevice([40, 50, 40]);
          showToast('Có ý chưa đúng — Chạm trực tiếp [Đúng]/[Sai] để sửa lại!', 'bad', 2100);
          persistCurrentSession(false);
          renderQuizView();
        }
        return;
      }

      persistCurrentSession(false);
      renderQuizView();
    }

    function handleCheckCurrentAnswer() {
      if (!S || S.mode !== 'practice') return;
      var item = S.items[S.curIdx];
      var q = CATALOG_MAP[item.uid];
      if (!item || !q || item.checked) return;
      if (!isItemAnswered(item)) {
        showToast('⚠️ Hãy chọn/nhập đủ đáp án trước khi Kiểm tra!', 'bad');
        return;
      }

      item.checked = true;
      var ev = evaluateQuizItem(item);
      recordFirstAttemptIfNeeded(item, ev.isFullCorrect);

      if (ev.isFullCorrect) {
        AudioSynth.correct();
        vibrateDevice(25);
        if (RAM.settings.oneHand) {
          showToast('Làm tốt lắm - Hãy giữ vững phong độ. Tiến lên', 'ok', 1350);
          triggerAutoAdvance(Boolean(q.explanation));
        }
      } else {
        AudioSynth.wrong();
        vibrateDevice([40, 50, 40]);
      }

      persistCurrentSession(false);
      renderQuizView();
    }

    // ---------------- BẢNG NHÁP ĐIỆN TỬ (SCRATCHPAD CANVAS) ----------------
    const Scratchpad = (function () {
      var layer = null;
      var cv = null;
      var ctx = null;
      var drawing = false;
      var penColor = '#ffae2b';
      var isEraser = false;
      var lastPt = { x: 0, y: 0 };

      function syncSize() {
        if (!cv || !ctx) return;
        var dpr = Math.min(window.devicePixelRatio || 1, 2);
        var w = window.innerWidth;
        var h = window.innerHeight;
        if (cv.width !== Math.floor(w * dpr) || cv.height !== Math.floor(h * dpr)) {
          var backup = document.createElement('canvas');
          backup.width = cv.width;
          backup.height = cv.height;
          if (cv.width > 0 && cv.height > 0) {
            backup.getContext('2d').drawImage(cv, 0, 0);
          }
          cv.width = Math.floor(w * dpr);
          cv.height = Math.floor(h * dpr);
          ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
          if (backup.width > 0 && backup.height > 0) {
            ctx.drawImage(backup, 0, 0, w, h);
          }
        }
      }

      function init() {
        layer = document.getElementById('scratch-layer');
        cv = document.getElementById('scratch-canvas');
        if (!layer || !cv) return;
        ctx = cv.getContext('2d');
        window.addEventListener('resize', function () {
          if (layer && !layer.classList.contains('hidden')) syncSize();
        });

        cv.addEventListener('pointerdown', function (ev) {
          drawing = true;
          lastPt = { x: ev.clientX, y: ev.clientY };
          try { cv.setPointerCapture(ev.pointerId); } catch (_) {}
        });

        cv.addEventListener('pointermove', function (ev) {
          if (!drawing || !ctx) return;
          ctx.save();
          ctx.lineCap = 'round';
          ctx.lineJoin = 'round';
          if (isEraser) {
            ctx.globalCompositeOperation = 'destination-out';
            ctx.lineWidth = 26;
          } else {
            ctx.globalCompositeOperation = 'source-over';
            ctx.strokeStyle = penColor;
            ctx.lineWidth = 3.2;
          }
          ctx.beginPath();
          ctx.moveTo(lastPt.x, lastPt.y);
          ctx.lineTo(ev.clientX, ev.clientY);
          ctx.stroke();
          ctx.restore();
          lastPt = { x: ev.clientX, y: ev.clientY };
        });

        function stopDraw() { drawing = false; }
        cv.addEventListener('pointerup', stopDraw);
        cv.addEventListener('pointercancel', stopDraw);

        var dock = document.getElementById('scratch-dock');
        if (dock) {
          dock.addEventListener('click', function (ev) {
            var cBtn = ev.target.closest('[data-scolor]');
            if (cBtn) {
              isEraser = false;
              penColor = cBtn.getAttribute('data-scolor');
              dock.querySelectorAll('.color-dot').forEach(function (d) { d.classList.remove('on'); });
              cBtn.classList.add('on');
              var erBtn = document.getElementById('btn-sc-eraser');
              if (erBtn) erBtn.classList.remove('on');
              return;
            }
            var aBtn = ev.target.closest('[data-sact]');
            if (!aBtn) return;
            var act = aBtn.getAttribute('data-sact');
            if (act === 'eraser') {
              isEraser = !isEraser;
              aBtn.classList.toggle('on', isEraser);
            } else if (act === 'clear' && ctx) {
              ctx.clearRect(0, 0, window.innerWidth, window.innerHeight);
            } else if (act === 'hide') {
              layer.classList.add('hidden');
            }
          });
        }
      }

      return {
        init: init,
        toggle: function () {
          if (!layer) return;
          var willOpen = layer.classList.contains('hidden');
          layer.classList.toggle('hidden', !willOpen);
          if (willOpen) syncSize();
        }
      };
    })();

    // ---------------- GẮN SỰ KIỆN ỦY QUYỀN DUY NHẤT (CLEAN EVENT DELEGATION) ----------------
    function bindGlobalEvents() {
      // 1. Callback khi thanh trượt Liquid Glass chọn mục mới
      onLgSelectCallback = function (key, val) {
        if (key === 'nav') {
          AppState.screen = 'tabs';
          AppState.tab = val;
          renderActiveTabBody();
        } else if (key === 'mode') {
          RAM.settings.mode = val;
          StorageEngine.saveSettings();
          var box = document.getElementById('exam-mins-box');
          if (box) box.style.display = val === 'exam' ? '' : 'none';
        } else if (key === 'lbFilter') {
          AppState.lbFilter = val;
          var pills = document.getElementById('lb-lesson-pills');
          if (pills) pills.style.display = val === 'lesson' ? '' : 'none';
          renderLeaderboardListOnly();
        } else if (key === 'revFilter') {
          AppState.revFilter = val;
          renderReviewItemsOnly();
        }
      };

      // 2. Ủy quyền Click duy nhất trên toàn tài liệu
      document.addEventListener('click', function (ev) {
        var actEl = ev.target && ev.target.closest ? ev.target.closest('[data-act]') : null;
        if (!actEl) return;
        var act = actEl.getAttribute('data-act');

        // Ngăn sự kiện click nút loại trừ lan ra chọn đáp án
        if (act === 'elim-opt') {
          ev.stopPropagation();
          if (!S) return;
          var eItem = S.items[S.curIdx];
          var oIdx = parseInt(actEl.getAttribute('data-idx'), 10);
          if (!eItem.eliminated) eItem.eliminated = [];
          var pos = eItem.eliminated.indexOf(oIdx);
          if (pos === -1) eItem.eliminated.push(oIdx);
          else eItem.eliminated.splice(pos, 1);
          AudioSynth.tap();
          persistCurrentSession(false);
          renderQuizView();
          return;
        }

        switch (act) {
          case 'close-modal':
            closeModal();
            break;
          case 'close-modal-bg':
            if (ev.target === actEl) closeModal();
            break;
          case 'resume-quiz':
            resumeSavedSession();
            break;
          case 'discard-resume':
            StorageEngine.saveActiveSession(null);
            S = null;
            renderActiveTabBody();
            showToast('🗑️ Đã xóa phiên làm dở', '', 1500);
            break;

          case 'toggle-setting': {
            var sKey = actEl.getAttribute('data-key');
            RAM.settings[sKey] = !RAM.settings[sKey];
            StorageEngine.saveSettings();
            AudioSynth.tap();
            actEl.classList.toggle('on', Boolean(RAM.settings[sKey]));
            break;
          }

          case 'set-exam-min': {
            RAM.settings.examMinutes = parseInt(actEl.getAttribute('data-min'), 10) || 45;
            StorageEngine.saveSettings();
            AudioSynth.tap();
            document.querySelectorAll('[data-act="set-exam-min"]').forEach(function (b) {
              b.classList.toggle('on', parseInt(b.getAttribute('data-min'), 10) === RAM.settings.examMinutes);
            });
            break;
          }

          case 'toggle-lesson': {
            var lsTitle = actEl.getAttribute('data-lesson');
            var curLs = RAM.settings.selectedLessons || [];
            var lPos = curLs.indexOf(lsTitle);
            if (lPos === -1) curLs.push(lsTitle);
            else if (curLs.length > 1) curLs.splice(lPos, 1);
            else showToast('ℹ️ Cần chọn ít nhất 1 bài học', '');
            RAM.settings.selectedLessons = curLs;
            StorageEngine.saveSettings();
            AudioSynth.tap();
            renderActiveTabBody();
            break;
          }

          case 'select-all-lessons':
            RAM.settings.selectedLessons = LESSONS.map(function (l) { return l.title; });
            StorageEngine.saveSettings();
            AudioSynth.tap();
            renderActiveTabBody();
            break;

          case 'toggle-qtype': {
            var qt = actEl.getAttribute('data-qtype');
            var curTypes = RAM.settings.selectedTypes || [];
            var tPos = curTypes.indexOf(qt);
            if (tPos === -1) curTypes.push(qt);
            else if (curTypes.length > 1) curTypes.splice(tPos, 1);
            else showToast('ℹ️ Cần giữ ít nhất 1 dạng câu hỏi', '');
            RAM.settings.selectedTypes = curTypes;
            StorageEngine.saveSettings();
            AudioSynth.tap();
            renderActiveTabBody();
            break;
          }

          case 'start-main': {
            var mainPool = countSelectedPool();
            startNewQuizSession(mainPool);
            break;
          }

          case 'quick-star': {
            var starPool = getBookmarkPool('star');
            if (starPool.length === 0) {
              showToast('⭐ Chưa có câu nào được gắn cờ "Câu hay"', '');
              return;
            }
            startNewQuizSession(starPool, '⭐ Ôn tập Câu hay (' + starPool.length + ' câu)', 'practice');
            break;
          }

          case 'quick-warn': {
            var warnPool = getBookmarkPool('warn');
            if (warnPool.length === 0) {
              showToast('⚠️ Chưa có câu nào được gắn cờ "Câu phân vân"', '');
              return;
            }
            startNewQuizSession(warnPool, '⚠️ Ôn tập Câu phân vân (' + warnPool.length + ' câu)', 'practice');
            break;
          }

          case 'quick-wrong': {
            var wrongRows = getWrongStatsSorted();
            if (wrongRows.length === 0) {
              showToast('🎉 Hiện chưa có câu nào trong danh sách hay làm sai!', 'ok');
              return;
            }
            var wPool = wrongRows.map(function (r) { return r.q; });
            startNewQuizSession(wPool, '❗ Luyện câu hay sai (' + wPool.length + ' câu)', 'practice');
            break;
          }

          case 'export-json':
            StorageEngine.exportBackupJson();
            showToast('💾 Đã xuất file sao lưu (.json) thành công!', 'ok');
            break;

          case 'import-json': {
            var fInp = document.getElementById('backup-file-input');
            if (fInp) { fInp.value = ''; fInp.click(); }
            break;
          }

          case 'pick-single':
            handlePickSingle(parseInt(actEl.getAttribute('data-idx'), 10));
            break;

          case 'pick-tf':
            handlePickTrueFalse(
              parseInt(actEl.getAttribute('data-sidx'), 10),
              actEl.getAttribute('data-val') === 'true'
            );
            break;

          case 'numpad': {
            if (!S) return;
            var npItem = S.items[S.curIdx];
            if (!npItem || npItem.type !== 'short' || npItem.checked) return;
            var k = actEl.getAttribute('data-k');
            AudioSynth.tap();
            if (k === 'OK') {
              handleCheckCurrentAnswer();
              return;
            }
            var curTxt = String(npItem.inputText || '');
            if (k === 'C') curTxt = '';
            else if (k === '⌫') curTxt = curTxt.slice(0, -1);
            else if (k === '-') curTxt = curTxt.indexOf('-') === 0 ? curTxt.slice(1) : ('-' + curTxt);
            else if (k === ',') {
              if (curTxt.indexOf(',') === -1 && curTxt.indexOf('.') === -1) {
                curTxt = (curTxt === '' || curTxt === '-') ? (curTxt + '0,') : (curTxt + ',');
              }
            } else if (curTxt.length < 14) {
              curTxt += k;
            }
            npItem.inputText = curTxt;
            persistCurrentSession(false);
            renderQuizView();
            break;
          }

          case 'check-answer':
            handleCheckCurrentAnswer();
            break;

          case 'retry-current': {
            if (!S) return;
            cancelAutoNext();
            var rItem = S.items[S.curIdx];
            rItem.checked = false;
            if (rItem.type === 'single') rItem.picked = null;
            if (rItem.type === 'truefalse') rItem.picks = [null, null, null, null];
            if (rItem.type === 'short') rItem.inputText = '';
            AudioSynth.tap();
            persistCurrentSession(false);
            renderQuizView();
            break;
          }

          case 'next-or-finish':
            cancelAutoNext();
            if (!S) return;
            if (S.curIdx < S.items.length - 1) {
              S.curIdx += 1;
              AudioSynth.tap();
              persistCurrentSession(false);
              renderQuizView();
            } else {
              finishAndSubmitQuiz();
            }
            break;

          case 'prev-q':
            cancelAutoNext();
            if (S && S.curIdx > 0) {
              S.curIdx -= 1;
              AudioSynth.tap();
              persistCurrentSession(false);
              renderQuizView();
            }
            break;

          case 'next-q':
            cancelAutoNext();
            if (S && S.curIdx < S.items.length - 1) {
              S.curIdx += 1;
              AudioSynth.tap();
              persistCurrentSession(false);
              renderQuizView();
            }
            break;

          case 'pause-to-home':
            cancelAutoNext();
            stopQuizTimerLoop();
            persistCurrentSession(true);
            AppState.screen = 'tabs';
            AppState.tab = 'home';
            renderShell();
            showToast('💾 Đã lưu tiến trình — Bạn có thể làm tiếp bất cứ lúc nào!', 'ok');
            break;

          case 'quick-toggle-onehand':
            cancelAutoNext();
            RAM.settings.oneHand = !RAM.settings.oneHand;
            StorageEngine.saveSettings();
            AudioSynth.tap();
            renderQuizView();
            showToast('🤚 Chế độ 1 Tay: ' + (RAM.settings.oneHand ? 'ĐÃ BẬT' : 'ĐÃ TẮT'), '');
            break;

          case 'quick-toggle-sound':
            RAM.settings.sound = !RAM.settings.sound;
            StorageEngine.saveSettings();
            if (RAM.settings.sound) AudioSynth.tap();
            renderQuizView();
            break;

          case 'toggle-scratch':
            Scratchpad.toggle();
            break;

          case 'bookmark': {
            if (!S) return;
            var curQ = S.items[S.curIdx];
            var bmKind = actEl.getAttribute('data-bm');
            if (RAM.bookmarks[curQ.uid] === bmKind) delete RAM.bookmarks[curQ.uid];
            else RAM.bookmarks[curQ.uid] = bmKind;
            StorageEngine.saveBookmarks();
            AudioSynth.tap();
            renderQuizView();
            break;
          }

          case 'open-palette':
            openQuestionPaletteModal();
            break;

          case 'jump-q':
            if (S) {
              S.curIdx = parseInt(actEl.getAttribute('data-qidx'), 10) || 0;
              closeModal();
              persistCurrentSession(false);
              renderQuizView();
            }
            break;

          case 'submit-exam': {
            if (!S) return;
            closeModal();
            var unAns = S.items.filter(function (i) { return !isItemAnswered(i); }).length;
            if (unAns > 0) {
              if (!window.confirm('Bạn còn ' + unAns + ' câu chưa trả lời. Bạn có chắc chắn muốn nộp bài ngay?')) {
                return;
              }
            }
            finishAndSubmitQuiz();
            break;
          }

          case 'zoom-img':
            openImageZoomModal(actEl.getAttribute('src'));
            break;

          case 'retry-wrong-last': {
            var last = AppState.lastResult;
            if (!last || !Array.isArray(last.wrongUids) || last.wrongUids.length === 0) return;
            var retryPool = last.wrongUids.map(function (id) { return CATALOG_MAP[id]; }).filter(Boolean);
            startNewQuizSession(retryPool, '🔁 Làm lại ' + retryPool.length + ' câu sai', 'practice');
            break;
          }

          case 'retry-wrong-record': {
            var recId = actEl.getAttribute('data-id');
            var foundRec = RAM.historyRecords.find(function (r) { return r.id === recId; });
            if (!foundRec || !Array.isArray(foundRec.wrongUids)) return;
            var recPool = foundRec.wrongUids.map(function (id) { return CATALOG_MAP[id]; }).filter(Boolean);
            startNewQuizSession(recPool, '🔁 Làm lại ' + recPool.length + ' câu sai', 'practice');
            break;
          }

          case 'open-review': {
            var revId = actEl.getAttribute('data-id');
            var targetRec = (AppState.lastResult && AppState.lastResult.id === revId)
              ? AppState.lastResult
              : RAM.historyRecords.find(function (r) { return r.id === revId; });
            if (targetRec) {
              AppState.reviewRecord = targetRec;
              AppState.revFilter = 'all';
              AppState.screen = 'review';
              renderShell();
            }
            break;
          }

          case 'goto-leaderboard':
            AppState.screen = 'tabs';
            AppState.tab = 'leaderboard';
            renderShell();
            break;

          case 'back-to-tabs':
            AppState.screen = 'tabs';
            renderShell();
            break;

          case 'clear-history':
            if (window.confirm('Xóa toàn bộ lịch sử các lượt làm bài trên thiết bị này?')) {
              StorageEngine.clearHistory();
              renderActiveTabBody();
              showToast('🗑️ Đã xóa lịch sử làm bài', '');
            }
            break;

          case 'refresh-lb':
            AudioSynth.tap();
            LeaderboardEngine.fetchEntries(true).then(function () {
              showToast('🔄 Đã đồng bộ Bảng xếp hạng mới nhất', 'ok', 1300);
            });
            break;

          case 'set-lb-lesson':
            AppState.lbLesson = actEl.getAttribute('data-lesson') || 'ALL';
            AudioSynth.tap();
            document.querySelectorAll('[data-act="set-lb-lesson"]').forEach(function (b) {
              b.classList.toggle('on', (b.getAttribute('data-lesson') || 'ALL') === AppState.lbLesson);
            });
            renderLeaderboardListOnly();
            break;
        }
      });

      // 3. Click chuột phải trên phương án .opt để gạch loại trừ đáp án nhiễu
      document.addEventListener('contextmenu', function (ev) {
        var optEl = ev.target && ev.target.closest ? ev.target.closest('.opt[data-act="pick-single"]') : null;
        if (!optEl || !S || AppState.screen !== 'quiz') return;
        ev.preventDefault();
        var item = S.items[S.curIdx];
        var dIdx = parseInt(optEl.getAttribute('data-idx'), 10);
        if (!item.eliminated) item.eliminated = [];
        var pos = item.eliminated.indexOf(dIdx);
        if (pos === -1) item.eliminated.push(dIdx);
        else item.eliminated.splice(pos, 1);
        AudioSynth.tap();
        persistCurrentSession(false);
        renderQuizView();
      });

      // 4. Ủy quyền sự kiện nhập liệu (Họ tên, Ô trả lời ngắn, Ghi chú cá nhân, File JSON)
      document.addEventListener('input', function (ev) {
        var t = ev.target;
        if (!t) return;

        if (t.id === 'inp-player-name') {
          RAM.settings.playerName = t.value;
          StorageEngine.saveSettings();
          return;
        }

        if (t.id === 'short-ans-input' && S) {
          var sItem = S.items[S.curIdx];
          if (sItem && sItem.type === 'short') {
            sItem.inputText = t.value;
            persistCurrentSession(false);
            var chkBtn = document.querySelector('[data-act="check-answer"]');
            if (chkBtn) chkBtn.disabled = !isItemAnswered(sItem);
          }
          return;
        }

        if (t.id === 'personal-note-inp') {
          cancelAutoNext(); // Không tự chuyển câu khi người dùng đang gõ ghi chú
          var uid = t.getAttribute('data-uid');
          if (uid) {
            RAM.notes[uid] = t.value;
            StorageEngine.saveNotes();
          }
        }
      });

      document.addEventListener('focusin', function (ev) {
        if (ev.target && ev.target.id === 'personal-note-inp') {
          cancelAutoNext();
        }
      });

      var fileInp = document.getElementById('backup-file-input');
      if (fileInp) {
        fileInp.addEventListener('change', function (ev) {
          var file = ev.target.files && ev.target.files[0];
          if (!file) return;
          var reader = new FileReader();
          reader.onload = function () {
            try {
              StorageEngine.importBackupJson(String(reader.result || ''));
              renderShell();
              showToast('📥 Đã khôi phục dữ liệu sao lưu thành công!', 'ok', 2400);
            } catch (err) {
              showToast('❌ File sao lưu không đúng định dạng JSON!', 'bad', 2500);
            }
          };
          reader.readAsText(file);
        });
      }

      // 5. Phím tắt tốc độ cao trên máy tính (PC Speed-Run)
      document.addEventListener('keydown', function (ev) {
        if (AppState.screen !== 'quiz' || !S) return;
        var activeTag = document.activeElement ? document.activeElement.tagName : '';
        var isNote = document.activeElement && document.activeElement.id === 'personal-note-inp';
        if (isNote) return;

        var item = S.items[S.curIdx];
        if (!item) return;

        // Phím Enter trong ô Trả lời ngắn
        if (activeTag === 'INPUT' && document.activeElement.id === 'short-ans-input') {
          if (ev.key === 'Enter') {
            ev.preventDefault();
            if (S.mode === 'practice' && !item.checked) handleCheckCurrentAnswer();
            else if (S.curIdx < S.items.length - 1) {
              S.curIdx += 1;
              persistCurrentSession(false);
              renderQuizView();
            } else {
              finishAndSubmitQuiz();
            }
          }
          return;
        }

        if (activeTag === 'INPUT' || activeTag === 'TEXTAREA') return;

        var keyUpper = String(ev.key || '').toUpperCase();
        var mapChoice = { '1': 0, '2': 1, '3': 2, '4': 3, 'A': 0, 'B': 1, 'C': 2, 'D': 3 };

        if (item.type === 'single' && mapChoice[keyUpper] !== undefined) {
          ev.preventDefault();
          handlePickSingle(mapChoice[keyUpper]);
          return;
        }

        if (ev.key === 'Enter' || ev.key === ' ') {
          ev.preventDefault();
          cancelAutoNext();
          if (S.mode === 'practice' && !item.checked) {
            handleCheckCurrentAnswer();
          } else if (S.curIdx < S.items.length - 1) {
            S.curIdx += 1;
            persistCurrentSession(false);
            renderQuizView();
          } else {
            finishAndSubmitQuiz();
          }
          return;
        }

        if (ev.key === 'ArrowLeft' && S.curIdx > 0) {
          ev.preventDefault();
          cancelAutoNext();
          S.curIdx -= 1;
          persistCurrentSession(false);
          renderQuizView();
        } else if (ev.key === 'ArrowRight' && S.curIdx < S.items.length - 1) {
          ev.preventDefault();
          cancelAutoNext();
          S.curIdx += 1;
          persistCurrentSession(false);
          renderQuizView();
        }
      });

      // 6. Vuốt ngang chuyển câu (Swipe Gesture hỗ trợ thao tác 1 tay trên điện thoại)
      var touchX0 = 0;
      var touchY0 = 0;
      var touchIgnore = false;

      document.addEventListener('touchstart', function (ev) {
        if (AppState.screen !== 'quiz' || !S || !ev.touches || ev.touches.length !== 1) return;
        var scratchOpen = !document.getElementById('scratch-layer').classList.contains('hidden');
        if (scratchOpen || (ev.target && ev.target.closest && ev.target.closest('.lg'))) {
          touchIgnore = true;
          return;
        }
        touchIgnore = false;
        touchX0 = ev.touches[0].clientX;
        touchY0 = ev.touches[0].clientY;
      }, { passive: true });

      document.addEventListener('touchend', function (ev) {
        if (touchIgnore || AppState.screen !== 'quiz' || !S || !ev.changedTouches || !ev.changedTouches[0]) return;
        var dx = ev.changedTouches[0].clientX - touchX0;
        var dy = ev.changedTouches[0].clientY - touchY0;
        if (Math.abs(dx) > 68 && Math.abs(dx) > Math.abs(dy) * 1.75) {
          cancelAutoNext();
          if (dx < 0 && S.curIdx < S.items.length - 1) {
            S.curIdx += 1;
            AudioSynth.tap();
            persistCurrentSession(false);
            renderQuizView();
          } else if (dx > 0 && S.curIdx > 0) {
            S.curIdx -= 1;
            AudioSynth.tap();
            persistCurrentSession(false);
            renderQuizView();
          }
        }
      }, { passive: true });
    }

    // =========================================================================
    // PHẦN 10: KHỞI CHẠY ỨNG DỤNG AN TOÀN SAU KHI DOM SẴN SÀNG
    // =========================================================================
    document.addEventListener('DOMContentLoaded', function () {
      lensFilter();
      rippleInit();
      Scratchpad.init();
      bindGlobalEvents();

      StorageEngine.boot().then(function () {
        LeaderboardEngine.fetchEntries(false);
        renderShell();
        openResumePromptIfAvailable();
      });
    });
  })();
  </script>
